# Сторінки подій і міст, файли App Links / Universal Links і заголовки безпеки для решти сайту з GitHub Pages.
# Деплой і налаштування — README.md.
name = "poriad-web"
main = "index.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

# Весь домен: сторінки Pages воркер бере з origin і додає до HTML CSP (index.mjs, pages).
routes = [
  { pattern = "poriad.app/*", zone_name = "poriad.app" },
]

# Prod-проєкт Supabase і його публічний (publishable) ключ — ті самі, що в iosApp/Config.xcconfig.
[vars]
SUPABASE_URL = "https://tzdogzdvctlumsqlqskr.supabase.co"
SUPABASE_KEY = "sb_publishable_RoY0wFzTOcXlmOIYC0UE-w_fOt5rXPq"
# Amplitude: ключ інжесту, публічний за задумом; той самий, що poriad.prod.amplitudeKey у gradle.properties.
# Лише prod: у dev ключа нема, тож /api/t (worker/track.mjs) подій не шле — як dev-збірки застосунків.
AMPLITUDE_KEY = "2783f40823e30dad1fb9ffc4807cdc04"

# Підказки адрес кабінету (/api/geocode, worker/kabinet.mjs): повз кеш — 30 запитів за хвилину з однієї адреси (IPv6 —
# з мережі /64) і 120 на всіх разом. Ліміти — у межах локації Cloudflare й приблизні; namespace_id — свій лічильник
# (у dev — інші, щоб не ділити з prod).
[[ratelimits]]
name = "GEOCODE_LIMIT"
namespace_id = "1501"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "GEOCODE_GLOBAL"
namespace_id = "1503"
  [ratelimits.simple]
  limit = 120
  period = 60

# Аналітика кабінету (/api/t, worker/track.mjs): 60 подій за хвилину з однієї адреси.
[[ratelimits]]
name = "TRACK_LIMIT"
namespace_id = "1505"
  [ratelimits.simple]
  limit = 60
  period = 60

# Локальна перевірка: `npx wrangler dev --env dev` → http://localhost:8787. Сайт — тека site/ замість Pages, дані — dev.
# Без маршрутів: випадковий `wrangler deploy --env dev` не перехопить poriad.app.
[env.dev]
routes = []
assets = { directory = "../site", binding = "ASSETS", run_worker_first = true }

[[env.dev.ratelimits]]
name = "GEOCODE_LIMIT"
namespace_id = "1502"
  [env.dev.ratelimits.simple]
  limit = 30
  period = 60

[[env.dev.ratelimits]]
name = "GEOCODE_GLOBAL"
namespace_id = "1504"
  [env.dev.ratelimits.simple]
  limit = 120
  period = 60

[[env.dev.ratelimits]]
name = "TRACK_LIMIT"
namespace_id = "1506"
  [env.dev.ratelimits.simple]
  limit = 60
  period = 60

[env.dev.vars]
SUPABASE_URL = "https://ojadoyxeahepycpmjuvf.supabase.co"
SUPABASE_KEY = "sb_publishable_J56z68XYw4Qn1nuivKO1Dw_zEb2zaEu"
