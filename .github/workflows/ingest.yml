# Обхід афіш: за розкладом — у prod, вручну (Run workflow) — у prod чи dev на вибір.
# Runner — self-hosted на Mac: Concert.ua відповідає 403 на адреси GitHub-runner-ів (2026-09-25),
# а з домашньої адреси віддає. Поки Mac спить, GitHub тримає запуск у черзі до доби й стартує,
# щойно runner вийде на зв'язок. Реєстрація runner-а — tools/ingest/README.md.
name: ingest
on:
  schedule:
    - cron: "0 3 * * *"          # 06:00 Київ (влітку), 05:00 узимку
  workflow_dispatch:
    inputs:
      env:
        description: "Куди писати"
        type: choice
        options: [prod, dev]
        default: prod
permissions:
  contents: read
# Одна група на обидва середовища: тека runner-а й кеш спільні, паралельний обхід їх зіпсував би.
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    steps:
      # clean: false — лишає між запусками ігнорований tools/ingest/cache (геокодер, OSM, картки
      # badseller): без нього кожен обхід ходив би за всім заново, badseller сам — 43 хв.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: false
      # Системний python3 Mac із уже встановленим psycopg, як і для ручного запуску.
      - run: rm -rf out
      - id: tests
        run: python3 -m unittest discover -s tools/ingest -p 'test_*.py' -t .
      # Розклад не має inputs — тоді prod.
      - id: dump
        run: python3 tools/apply_sql.py run --env "${{ inputs.env || 'prod' }}" --apply --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
      # Аналіз обходу: фонова сесія Claude Code на цьому ж Mac (читає базу, нічого не пише). Запускається
      # завжди, і після збою теж: тоді вона найпотрібніша. Збій самого аналізу обхід не валить.
      - if: always()
        continue-on-error: true
        run: tools/ingest/analyze_run.sh
        env:
          # Довгий токен із `claude setup-token`: служба runner-а не бачить вхід користувача в macOS.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TARGET: ${{ inputs.env || 'prod' }}
          TESTS: ${{ steps.tests.outcome }}
          DUMP: ${{ steps.dump.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Тека лишається лише після збою — тоді вона й потрібна як доказ.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ingest-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
