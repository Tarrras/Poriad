# Обхід афіш і запис у prod. Лише вручну: Concert.ua відповідає 403 на адреси GitHub-runner-ів
# (перший запуск 2026-09-25), тож регулярний обхід без найбільшого джерела Києва робив би шкоду.
# Розклад живе на Mac (launchd, див. tools/ingest/README.md); цей workflow — запасний вхід.
name: ingest
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingest-prod
  cancel-in-progress: false
jobs:
  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Кеш геокодера й дампи OSM: без них кожен запуск ходить у Photon за всіма адресами заново.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tools/ingest/cache
          key: ingest-cache-${{ github.run_id }}
          restore-keys: ingest-cache-
      - run: python3 -m pip install --quiet "psycopg[binary]"
      - run: python3 -m unittest discover -s tools/ingest -p 'test_*.py' -t .
      - run: python3 tools/apply_sql.py run --env prod --apply --yes --keep
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ingest-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
