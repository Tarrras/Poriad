# Обхід афіш і запис у prod. Runner — self-hosted на Mac: Concert.ua відповідає 403 на адреси
# GitHub-runner-ів (2026-09-25), а з домашньої адреси віддає. Поки Mac спить, GitHub тримає запуск
# у черзі до доби й стартує, щойно runner вийде на зв'язок. Реєстрація runner-а — tools/ingest/README.md.
name: ingest
on:
  schedule:
    - cron: "0 3 * * *"          # 06:00 Київ (влітку), 05:00 узимку
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingest-prod
  cancel-in-progress: false
jobs:
  prod:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    steps:
      # clean: false — лишає між запусками ігнорований tools/ingest/cache (геокодер, OSM, картки
      # badseller): без нього кожен обхід ходив би за всім заново, badseller сам — 43 хв.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: false
      # Системний python3 Mac із уже встановленим psycopg, як і для ручного запуску.
      - run: rm -rf out
      - run: python3 -m unittest discover -s tools/ingest -p 'test_*.py' -t .
      - run: python3 tools/apply_sql.py run --env prod --apply --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Тека лишається лише після збою — тоді вона й потрібна як доказ.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ingest-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
