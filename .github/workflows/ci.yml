# Тести на кожен push і PR: конвеєр імпорту (без мережі й бази) і спільний KMP-код на JVM.
# Android SDK для конфігурації :androidApp уже є на ubuntu-latest (ANDROID_HOME), google-services.json у git.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m unittest discover -s tools/ingest -p 'test_*.py' -t .
  kmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew jvmTest --no-daemon
