<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #card-root { position: absolute; inset: 0; pointer-events: none; }
        /* the selected stand-up card, cut from the same screenshot the phone shows (x 49–1043, y 1910–2244 px, 0.76459 px per px;
           its corner radius ≈ 58 px, so the map outside the rounded corners is clipped) */
        #card-move { position: absolute; left: 160px; top: 540px; width: 760px; height: 255.4px; transform-origin: 0 0; }
        #card-shadow { position: absolute; inset: 0; border-radius: 44px; box-shadow: 0 50px 120px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08); opacity: 0; }
        #card-face { position: absolute; inset: 0; border-radius: 44px; overflow: hidden; background: #f5f5f7; }
        /* natural-size crop scaled down, so the picture's box is exactly the card */
        #card-face img { position: absolute; left: 0; top: 0; width: 994px; height: 334px; object-fit: none; object-position: -49px -1910px; transform: scale(0.76459); transform-origin: 0 0; display: block; }
      </style>

      <div data-hf-id="hf-d7kc" id="card-root" data-composition-id="card" data-width="1080" data-height="1920">
        <div data-hf-id="hf-o1uz" id="card-move">
          <div data-hf-id="hf-i8q8" id="card-shadow"></div>
          <div data-hf-id="hf-4r0v" id="card-face"><img data-hf-id="hf-608p" src="assets/ui/map-kyiv-card.png" alt="СТЕНДАП на А…, чт, 22 жовт. · 19:00, Афіша · Concert.ua"></div>
        </div>
      </div>

      <script>
        (() => {
          // Carrier proof → turn (local s; the section starts at 9.6 root = the proof's last camera has landed).
          // The lift is centred on the seam (10.4 root = 0.8 local), so the card crosses it at full speed.
          const T = { lift: 0.25, liftEnd: 1.35, out: 2.57, end: 2.9 };
          // = the card's rect inside the phone at the proof's last camera (s 1.95 → 0.75995 canvas px per screenshot px):
          // left 540 − 497 × 0.75995 = 162.30, top 600 − 167 × 0.75995 = 473.09
          const MATCH = { x: 2.3, y: -66.91, scale: 0.99393 };
          const tl = gsap.timeline({ paused: true });
          // lifts out of the phone while the phone falls away, lands in the turn
          tl.fromTo("#card-move", { ...MATCH }, { x: 0, y: 0, scale: 1, duration: T.liftEnd - T.lift, ease: "expo.inOut", immediateRender: true }, T.lift);
          tl.fromTo("#card-shadow", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T.lift + 0.1);
          // cut-the-curve: leaves left with the turn's line
          tl.to("#card-move", { x: -230, opacity: 0, duration: T.end - T.out, ease: "power4.in" }, T.out);
          window.__timelines["card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
