<!-- A1 name + end card, on paper, end-card grid v2 (_material/END-CARD.md): one centred column on x 540.
     The icon resolves from noise tiles; the coral «Поряд» is resolved by the wordmark-tiles mount (index.html,
     x 260–820 / y 758–918, cap-top ≈ 790); this scene types the turn line under it («Поряд збирає їх на одну мапу.»),
     backspaces it and types the brand slogan «Є куди. Буде з ким.» in the same slot, then the bait at the top,
     «безкоштовно» and both official store badges by one hard cut. -->
<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2"); font-weight: 200 900; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-latin.woff2") format("woff2"); font-weight: 200 900; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

        #end-root { position: absolute; inset: 0; overflow: hidden; background: #f5f5f7; color: #0b0b0f; font-family: "Inter", system-ui, sans-serif; }
        .end-type { position: absolute; left: 160px; width: 760px; text-align: center; font-family: "Unbounded", system-ui, sans-serif; font-weight: 300; letter-spacing: -0.035em; white-space: pre; }
        .end-type span { opacity: 0; }
        #end-bait { top: 300px; font-size: 52px; line-height: 59.8px; }
        #end-line, #end-slogan { top: 934px; font-size: 40px; line-height: 46px; color: #44444c; }
        #end-caret { position: absolute; left: 0; top: 0; width: 5px; height: 54px; background: #0b0b0f; opacity: 0; }
        /* the icon resolves like the name: noise tiles over the official icon flick off in a wave */
        #end-icon { position: absolute; left: 452px; top: 560px; width: 176px; height: 176px; }
        #end-icon img { position: absolute; inset: 0; width: 176px; height: 176px; border-radius: 40px; }
        #end-icon-tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
        .end-it { position: relative; background: #f5f5f7; }
        .end-it i { position: absolute; inset: 2px; }
        #end-free { position: absolute; left: 0; width: 1080px; top: 1110px; text-align: center; font-weight: 600; font-size: 34px; line-height: 40px; color: #44444c; opacity: 0; }
        #end-store { position: absolute; left: 0; width: 1080px; top: 1176px; display: flex; flex-direction: column; align-items: center; opacity: 0; }
        #end-badges { display: flex; gap: 32px; }
        /* Official badges: untouched files, both 104 px tall, no transform/filter/shadow */
        #end-badges img { display: block; height: 104px; width: auto; }
        #end-tm { margin-top: 22px; text-align: center; font-weight: 400; font-size: 20px; line-height: 28px; color: #63636d; white-space: nowrap; }
      </style>

      <div id="end-root" data-composition-id="end" data-width="1080" data-height="1920">
        <div class="end-type" id="end-bait"></div>
        <div class="end-type" id="end-line"></div>
        <div class="end-type" id="end-slogan"></div>
        <div id="end-caret"></div>
        <div id="end-icon">
          <img src="assets/icon.png" alt="Поряд" />
          <div id="end-icon-tiles"></div>
        </div>
        <div id="end-free"></div>
        <div id="end-store">
          <div id="end-badges">
            <img src="assets/appstore-badge-uk.svg" alt="Завантажте в App Store" />
            <img src="assets/googleplay-badge-uk.svg" alt="Завантажте з Google Play" />
          </div>
          <div id="end-tm">
            <div>Apple, логотип Apple і App Store є торговельними марками Apple Inc.</div>
            <div>Google Play і логотип Google Play є торговельними марками Google LLC.</div>
          </div>
        </div>
      </div>

      <script>
        (async () => {
          const root = document.getElementById("end-root");
          const $ = (s) => root.querySelector(s);
          const COPY = {
            line: "збирає їх на одну мапу.",
            slogan: "Є куди. Буде з ким.",
            bait: ["скільки в тебе каналів", "з афішами? 👇"],
            free: "безкоштовно",
          };
          // the name resolves 0.18–1.1 (wordmark-tiles); the line types as it lands and holds; the caret backspaces it
          // and types the slogan in its slot (still from 2.47, > 1 s before the static last 10 frames from 3.67);
          // then the bait, «безкоштовно» and the badges
          const T = { line: 0.6, erase: 1.7, slogan: 2.04, bait: 2.56, free: 2.95, store: 3.25 };
          await document.fonts.load('300 52px "Unbounded"', COPY.line + COPY.slogan + COPY.bait.join(""));
          $("#end-free").textContent = COPY.free;

          const tl = gsap.timeline({ paused: true });
          const caret = $("#end-caret");
          // this scene is not laid out while the timeline is built, so caret stops come from canvas metrics
          // (same font, size and letter-spacing as the CSS); lines are explicit, nothing wraps
          const ctx = document.createElement("canvas").getContext("2d");
          const setFont = (el) => {
            const cs = getComputedStyle(el);
            const fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight);
            ctx.font = "300 " + fs + 'px "Unbounded", system-ui, sans-serif';
            ctx.letterSpacing = (-0.035 * fs).toFixed(2) + "px";
            return { top: parseFloat(cs.top), lh, ch: Math.round(fs * 1.04) };
          };
          const typeLines = (el, lines, t0, step) => {
            const { top, lh, ch } = setFont(el);
            let t = t0;
            lines.forEach((text, li) => {
              const row = document.createElement("div");
              el.appendChild(row);
              // rows are centred on x 540: the hidden characters already take their room
              const left = 540 - ctx.measureText(text).width / 2;
              const y = top + li * lh + (lh - ch) / 2;
              tl.set(caret, { x: left, y, height: ch, opacity: 1 }, t - 0.08);
              [...text].forEach((ch, i, all) => {
                const sp = document.createElement("span");
                sp.textContent = ch;
                row.appendChild(sp);
                tl.set(sp, { opacity: 1 }, t);
                tl.set(caret, { x: left + ctx.measureText(all.slice(0, i + 1).join("")).width + 6, y }, t);
                t += step;
              });
              t += 0.08;
            });
            return t;
          };
          // backspace over a one-row line typed above: the caret walks back one character per step
          const eraseLine = (el, t0, step) => {
            const { top, lh, ch } = setFont(el);
            const spans = [...el.querySelectorAll("span")];
            const chars = spans.map((s) => s.textContent);
            const left = 540 - ctx.measureText(chars.join("")).width / 2;
            const y = top + (lh - ch) / 2;
            let t = t0;
            for (let i = spans.length - 1; i >= 0; i--) {
              tl.set(spans[i], { opacity: 0 }, t);
              tl.set(caret, { x: i ? left + ctx.measureText(chars.slice(0, i).join("")).width + 6 : left, y }, t);
              t += step;
            }
            return t;
          };
          tl.set(caret, { x: 0, y: 0, opacity: 0 }, 0);

          // icon: a 4×4 noise field (fixed pattern) flickers, then a wave lifts it off the icon
          const NOISE = ["#d9d9df", "#b4b4bd", "#0b0b0f"];
          const covers = [];
          for (let i = 0; i < 16; i++) {
            const tile = document.createElement("span");
            tile.className = "end-it";
            const face = document.createElement("i");
            face.style.background = NOISE[(i * 7 + (i >> 2)) % 3];
            tile.appendChild(face);
            $("#end-icon-tiles").appendChild(tile);
            covers.push({ tile, face, rank: (i % 4) + (i >> 2) * 0.68 });
          }
          covers.sort((a, b) => a.rank - b.rank);
          covers.forEach((c, i) => {
            tl.set(c.face, { opacity: 0.35 + ((i * 5) % 7) / 10 }, 0);
            tl.set(c.face, { opacity: 0.95 - ((i * 3) % 5) / 10 }, 2 / 30);
          });
          tl.to(covers.map((c) => c.tile), { opacity: 0, scale: 1.18, duration: 0.3, ease: "power2.out", stagger: 0.022 }, 0.12);

          typeLines($("#end-line"), [COPY.line], T.line, 0.026);
          eraseLine($("#end-line"), T.erase, 0.011);
          typeLines($("#end-slogan"), [COPY.slogan], T.slogan, 0.024);
          const baitDone = typeLines($("#end-bait"), COPY.bait, T.bait, 0.018);
          tl.set(caret, { opacity: 0 }, baitDone + 0.1);

          tl.fromTo("#end-free", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, T.free);
          tl.set("#end-store", { opacity: 1 }, T.store); // hard cut; the badge itself is never animated

          window.__timelines["end"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
