<!-- A1 name + end card, on paper. The coral «Поряд» is resolved by the wordmark-tiles mount (index.html,
     x 100–880 / y 590–840); this scene types the rest of the sentence under it, then the bait, «безкоштовно»
     and the official App Store badge by a hard cut. Everything is left-aligned on x 100. -->
<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2"); font-weight: 200 900; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded-latin.woff2") format("woff2"); font-weight: 200 900; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

        #end-root { position: absolute; inset: 0; overflow: hidden; background: #f5f5f7; color: #0b0b0f; font-family: "Inter", system-ui, sans-serif; }
        .end-type { position: absolute; left: 100px; width: 820px; font-family: "Unbounded", system-ui, sans-serif; font-weight: 300; letter-spacing: -0.035em; white-space: pre; }
        .end-type span { opacity: 0; }
        #end-bait { top: 296px; font-size: 50px; line-height: 64px; }
        #end-line { top: 858px; font-size: 52px; line-height: 66px; }
        #end-caret { position: absolute; left: 0; top: 0; width: 5px; height: 54px; background: #0b0b0f; opacity: 0; }
        #end-free { position: absolute; left: 100px; top: 1110px; font-weight: 600; font-size: 34px; line-height: 40px; color: #44444c; opacity: 0; }
        #end-store { position: absolute; left: 100px; top: 1168px; width: 800px; opacity: 0; }
        /* Official badge: untouched file, height 104px, no transform/filter/shadow */
        #end-store .badge { display: block; height: 104px; width: auto; }
        #end-tm { margin-top: 24px; font-weight: 400; font-size: 22px; line-height: 30px; color: #63636d; }
      </style>

      <div id="end-root" data-composition-id="end" data-width="1080" data-height="1920">
        <div class="end-type" id="end-bait"></div>
        <div class="end-type" id="end-line"></div>
        <div id="end-caret"></div>
        <div id="end-free"></div>
        <div id="end-store">
          <img class="badge" src="assets/appstore-badge-uk.svg" alt="Завантажте в App Store" />
          <div id="end-tm"></div>
        </div>
      </div>

      <script>
        (async () => {
          const root = document.getElementById("end-root");
          const $ = (s) => root.querySelector(s);
          const COPY = {
            line: "збирає їх на одну мапу.",
            bait: ["скільки в тебе каналів", "з афішами? 👇"],
            free: "безкоштовно",
            tm: "Apple, логотип Apple і App Store є торговельними марками Apple Inc.",
          };
          // the name resolves 0.18–1.1 (wordmark-tiles); the line types as it lands; the last second holds still
          const T = { line: 0.62, bait: 1.9, free: 2.4, store: 3.0 };
          await document.fonts.load('300 52px "Unbounded"', COPY.line + COPY.bait.join(""));
          $("#end-free").textContent = COPY.free;
          $("#end-tm").textContent = COPY.tm;

          const tl = gsap.timeline({ paused: true });
          const caret = $("#end-caret");
          // this scene is not laid out while the timeline is built, so caret stops come from canvas metrics
          // (same font, size and letter-spacing as the CSS); lines are explicit, nothing wraps
          const ctx = document.createElement("canvas").getContext("2d");
          const typeLines = (el, lines, t0, step) => {
            const cs = getComputedStyle(el);
            const left = parseFloat(cs.left), top = parseFloat(cs.top);
            const fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight);
            ctx.font = "300 " + fs + 'px "Unbounded", system-ui, sans-serif';
            ctx.letterSpacing = (-0.035 * fs).toFixed(2) + "px";
            let t = t0;
            lines.forEach((text, li) => {
              const row = document.createElement("div");
              el.appendChild(row);
              const y = top + li * lh + (lh - 54) / 2;
              tl.set(caret, { x: left, y, opacity: 1 }, t - 0.08);
              [...text].forEach((ch, i, all) => {
                const sp = document.createElement("span");
                sp.textContent = ch;
                row.appendChild(sp);
                tl.set(sp, { opacity: 1 }, t);
                tl.set(caret, { x: left + ctx.measureText(all.slice(0, i + 1).join("")).width + 6, y }, t);
                t += step;
              });
              t += 0.08;
            });
            return t;
          };
          tl.set(caret, { x: 0, y: 0, opacity: 0 }, 0);
          const lineDone = typeLines($("#end-line"), [COPY.line], T.line, 0.028);
          tl.set(caret, { opacity: 0 }, lineDone + 0.12);
          const baitDone = typeLines($("#end-bait"), COPY.bait, T.bait, 0.022);
          tl.set(caret, { opacity: 0 }, baitDone + 0.1);

          tl.fromTo("#end-free", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, T.free);
          tl.set("#end-store", { opacity: 1 }, T.store); // hard cut; the badge itself is never animated

          window.__timelines["end"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
