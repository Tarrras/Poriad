<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
      /* Fonts: local, variable Unbounded + Inter 400/600, split cyrillic/latin */
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-cyrillic-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
        #mark-root { position: absolute; inset: 0; pointer-events: none; }
        /* the «Поряд» lockup, as in the brand end card: icon over the name in coral (the only coral in the film).
           Revealed once in the turn under the card, then travels into the end card (final: y 470–870) */
        #mark-row { position: absolute; left: 0; width: 1080px; top: 470px; height: 400px; display: flex; justify-content: center; align-items: flex-start; }
        #mark-move, #mark-in { display: block; transform-origin: 50% 50%; }
        #mark-grow { display: flex; flex-direction: column; align-items: center; }
        #mark-icon { display: block; width: 220px; height: 220px; border-radius: 50px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 110px rgba(0, 0, 0, 0.5); }
        #mark-name { display: block; margin-top: 52px; font-family: "Unbounded", system-ui, sans-serif; font-weight: 900; font-size: 128px; line-height: 1; letter-spacing: -0.045em; color: #E0582F; white-space: nowrap; }
      </style>

      <div data-hf-id="hf-njki" id="mark-root" data-composition-id="mark" data-width="1080" data-height="1920">
        <div data-hf-id="hf-a249" id="mark-row"><div data-hf-id="hf-a990" id="mark-move"><div data-hf-id="hf-cqbe" id="mark-in"><div data-hf-id="hf-rc5i" id="mark-grow">
          <img data-hf-id="hf-7y0c" id="mark-icon" data-brand-mark="" src="assets/icon.png" alt="">
          <span data-hf-id="hf-p1s6" id="mark-name" data-brand-mark="">Поряд</span>
        </div></div></div></div>
      </div>

      <script>
        (() => {
          // Carrier turn → cta (local s; the section starts at 10.95 root as the card lands, the lockup lands at 13.11 = cta + 0.61).
          const T = { reveal: 0, travel: 1.26, travelEnd: 2.16, end: 3.65 };
          // under the card in the turn (card 540–795): centre 670 → 950, so the lockup spans 850–1050 and the coral «Поряд»
          // opens the turn's line «… збирає їх на одну мапу.» right under it
          const TURN = { x: 0, y: 280, scale: 0.5 };
          const tl = gsap.timeline({ paused: true });
          // inverse zoom: the one brand reveal
          tl.fromTo("#mark-in", { scale: 1.25, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, T.reveal);
          // travels up into the end card across the seam (11.7 root)
          tl.fromTo("#mark-move", { x: TURN.x, y: TURN.y, scale: TURN.scale }, { x: 0, y: 0, scale: 1, duration: T.travelEnd - T.travel, ease: "expo.inOut", immediateRender: true }, T.travel);
          // lands and holds, like the brand end card
          window.__timelines["mark"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
