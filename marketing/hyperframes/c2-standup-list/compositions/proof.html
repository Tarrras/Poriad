<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
      /* Fonts: local Sofia Sans Condensed 700/800 + Extra Condensed 800 (the app's own files, Ukrainian д, л, п baked in) and Inter 400/600, split cyrillic/latin */
      @font-face {
        font-family: "Sofia Sans Condensed";
        src: url("assets/fonts/SofiaSansCondensed-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Sofia Sans Condensed";
        src: url("assets/fonts/SofiaSansCondensed-ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-display: block;
      }
      @font-face {
        font-family: "Sofia Sans Extra Condensed";
        src: url("assets/fonts/SofiaSansExtraCondensed-ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-cyrillic-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
        #proof-root { position: absolute; inset: 0; overflow: hidden; color: #f3f3f0; font-family: "Inter", system-ui, sans-serif; }
        #proof-exit, #proof-enter, #proof-cam { position: absolute; inset: 0; }
        /* the picture fades out above y 412, so the caption band above it always sits on the dark ground */
        #proof-exit { transform-origin: 540px 930px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 412px, #000 470px); mask-image: linear-gradient(to bottom, transparent 0, transparent 412px, #000 470px); }
        #proof-enter { transform-origin: 540px 923px; }
        #proof-cam { transform-origin: 0 0; }
        #proof-phone {
          position: absolute;
          left: 293px;
          top: 400px;
          width: 494px;
          height: 1046px;
          padding: 12px;
          border-radius: 66px;
          background: #050506;
          box-shadow: 0 0 0 2px #3b3b44, 0 0 0 4px #16161b, inset 0 0 0 1px rgba(255, 255, 255, 0.09), 0 80px 160px rgba(0, 0, 0, 0.6);
        }
        #proof-screen { position: relative; width: 470px; height: 1022px; border-radius: 54px; overflow: hidden; background: #050506; }
        #proof-screen .shot, #proof-screen .sheet-wrap, #proof-screen .dim, #proof-screen .mine, #proof-screen .glare { position: absolute; left: 0; top: 0; width: 470px; height: 1022px; }
        #proof-screen .shot { display: block; object-fit: cover; }
        #proof-screen .dim { background: #050506; opacity: 0; }
        #proof-screen .mine { background: #0f0f13; opacity: 0; }
        #proof-screen .glare { background: linear-gradient(118deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 38%); }
        #proof-screen .tap { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: rgba(120, 120, 128, 0.34); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95), 0 6px 16px rgba(0, 0, 0, 0.35); opacity: 0; }
        #proof-screen .ripple { position: absolute; width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95); opacity: 0; }

        /* captions — one style for the whole film: a fixed band (x 160–920, y 280–416) above the picture,
           one size, centred; they fade in and out in place and never move sideways */
        .caption-band { position: absolute; left: 160px; width: 760px; top: 280px; height: 136px; display: flex; align-items: center; justify-content: center; }
        .caption { display: block; max-width: 760px; font-family: "Sofia Sans Condensed", system-ui, sans-serif; font-weight: 800; font-size: 72px; line-height: 1.02; letter-spacing: -0.005em; text-align: center; text-wrap: balance; color: #f3f3f0; text-shadow: 0 8px 30px rgba(0, 0, 0, 0.6); }
      </style>

      <div data-hf-id="hf-b5rk" id="proof-root" data-composition-id="proof" data-width="1080" data-height="1920">
        <div data-hf-id="hf-vv0y" id="proof-exit">
          <div data-hf-id="hf-cam0" id="proof-enter">
            <div data-hf-id="hf-f010" id="proof-cam" data-layout-allow-overflow="true">
              <div data-hf-id="hf-ztdm" id="proof-phone"><div data-hf-id="hf-2sbq" id="proof-screen"></div></div>
            </div>
          </div>
        </div>
        <div data-hf-id="hf-arq5" id="proof-caps"></div>
      </div>

      <script>
        (() => {
          // ═══ PHONE — UI sequence (local s). Points are screenshot px (1206×2622); cam.at lands on canvas cam.to at zoom cam.s ═══
          const PHONE = {
            dir: "assets/ui/",
            shots: { detail: "c2-1-detail.png", sheet: "c2-2-sheet.png", changed: "c2-3-sheet-time.png", mine: "c2-4-after.png" },
            sheetTop: { sheet: 218 },
            // match cut: the hook ends on the «Шукаю компанію» button (800 × 1.12 × 1.3 px wide, centre 540, 880);
            // the phone opens on that same button at the same size, then pulls back to show it on the stand-up page
            match: { s: 3.8026, at: [476, 2405], to: [540, 880] },
            open: { t: 1.05, tap: [476, 2405], cam: { t: 0, d: 0.8, s: 1.3, at: [603, 2405], to: [540, 1290] } },
            sheet: 1.15,
            // meeting time «−»: 18:30 → 18:15, «За 45 хв до початку»
            change: { t: 2.15, tap: [876, 874], cam: { t: 1.5, d: 0.5, s: 1.6, at: [560, 878], to: [510, 880] } },
            publish: { t: 3.15, tap: [603, 1658], cam: { t: 2.6, d: 0.45, s: 1.3, at: [603, 1658], to: [540, 1120] } },
            // published: the sheet drops and the event page now lists the «Ваш пошук» card under «Шукають компанію»
            // (no share sheet: people join inside the app, nobody has to send a link); mine.crop = the y-band kept
            back: { t: 3.3, crop: [1054, 1454], cam: { t: 3.3, d: 0.55, s: 1.95, at: [603, 1254], to: [510, 820] } },
            out: 4.2, // the card is handed to the root here; the phone falls away around it
          };
          const CAPTIONS = [
            // one caption per action, on screen while that action happens
            { text: "тиснеш «шукаю компанію»", at: 0.2, out: 1.2 },          // tap at 1.05
            { text: "ставиш час зустрічі", at: 1.5, out: 2.85 },             // sheet settled 1.6, 18:30 → 18:15 at 2.15
            { text: "і запит з'являється на події", at: 3.4, out: 4.6 },     // the «Ваш пошук» card, 3.3 → lift 4.45
          ];

          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const el = (tag, cls, text) => {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text != null) n.textContent = text;
            return n;
          };

          const K = 470 / 1206;
          const SCREEN_H = 1022;
          const SCREEN_X = 540 - 235;
          const SCREEN_Y = 400 + 12;
          const screen = $("#proof-screen");
          const shot = (name, parent = screen) => {
            const img = el("img", "shot");
            img.src = PHONE.dir + name;
            img.alt = "";
            return parent.appendChild(img);
          };
          const sheetWrap = (topPx) => {
            const w = screen.appendChild(el("div", "sheet-wrap"));
            w.style.clipPath = `inset(${(topPx * K).toFixed(1)}px 0 0 0 round 16px 16px 0 0)`;
            return w;
          };
          const camState = ({ s, at, to }) => ({ scale: s, x: to[0] - s * (SCREEN_X + at[0] * K), y: to[1] - s * (SCREEN_Y + at[1] * K) });
          const camTo = (c) => tl.to("#proof-cam", { ...camState(c), duration: c.d, ease: "expo.inOut" }, c.t);
          const tap = ([px, py], t) => {
            const place = (n) => {
              n.style.left = `${(px * K - 22).toFixed(1)}px`;
              n.style.top = `${(py * K - 22).toFixed(1)}px`;
              return n;
            };
            const d = place(screen.appendChild(el("div", "tap")));
            const r = place(screen.appendChild(el("div", "ripple")));
            tl.fromTo(d, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.08, ease: "power2.out" }, t - 0.06);
            tl.to(d, { opacity: 0, scale: 0.85, duration: 0.22, ease: "power1.in" }, t + 0.1);
            tl.fromTo(r, { opacity: 0 }, { opacity: 0.8, duration: 0.01, ease: "none" }, t);
            tl.fromTo(r, { scale: 1 }, { scale: 2.2, duration: 0.45, ease: "power2.out" }, t);
            tl.to(r, { opacity: 0, duration: 0.44, ease: "power1.out" }, t + 0.01);
          };

          shot(PHONE.shots.detail);
          const dim = screen.appendChild(el("div", "dim"));
          const mine = screen.appendChild(el("div", "mine"));
          const [top, bottom] = PHONE.back.crop;
          shot(PHONE.shots.mine, mine).style.clipPath = `inset(${(top * K).toFixed(1)}px 0 ${((2622 - bottom) * K).toFixed(1)}px 0)`;
          const wSheet = sheetWrap(PHONE.sheetTop.sheet);
          shot(PHONE.shots.sheet, wSheet);
          const changed = shot(PHONE.shots.changed, wSheet);
          screen.appendChild(el("div", "glare"));

          // the hook lurched onto «Шукаю компанію»: the phone opens already pushed in on that button,
          // flying flat out of a tilt under a light wash that dies away (M958's panels after the cut)
          // match cut onto the same button, then the camera pulls back to the page around it
          tl.fromTo("#proof-cam", camState(PHONE.match), { ...camState(PHONE.open.cam), duration: PHONE.open.cam.d, ease: "expo.out", immediateRender: true }, PHONE.open.cam.t);
          // tap «Шукаю компанію» → the page dims, the sheet slides up
          tap(PHONE.open.tap, PHONE.open.t);
          tl.fromTo(dim, { opacity: 0 }, { opacity: 0.35, duration: 0.4, ease: "power1.out" }, PHONE.sheet);
          tl.fromTo(wSheet, { y: SCREEN_H - PHONE.sheetTop.sheet * K }, { y: 0, duration: 0.45, ease: "expo.out" }, PHONE.sheet);
          // tap «−»: 18:30 → 18:15
          camTo(PHONE.change.cam);
          tap(PHONE.change.tap, PHONE.change.t);
          tl.fromTo(changed, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, PHONE.change.t + 0.05);
          // tap «Опублікувати й поділитися» → the sheet drops
          camTo(PHONE.publish.cam);
          tap(PHONE.publish.tap, PHONE.publish.t);
          tl.to(wSheet, { y: SCREEN_H - PHONE.sheetTop.sheet * K, duration: 0.22, ease: "power2.in" }, PHONE.publish.t + 0.06);
          tl.to(dim, { opacity: 0, duration: 0.22, ease: "power1.in" }, PHONE.publish.t + 0.06);
          // the page now shows the new «Ваш пошук» card; the camera goes to it
          tl.fromTo(mine, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.inOut" }, PHONE.back.t);
          camTo(PHONE.back.cam);
          // the root lifts the card out at PHONE.out; the phone falls away around it
          tl.to("#proof-exit", { scale: 0.92, opacity: 0, filter: "blur(12px)", duration: 0.4, ease: "power2.in" }, PHONE.out);

          // captions
          CAPTIONS.forEach((c) => {
            const cap = $("#proof-caps").appendChild(el("div", "caption-band")).appendChild(el("div", "caption", c.text));
            tl.fromTo(cap, { opacity: 0, y: 20, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, c.at);
            tl.to(cap, { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, c.out - 0.25);
          });

          window.__timelines["proof"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
