    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Sofia Sans Condensed"; src: url("assets/fonts/SofiaSansCondensed-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Sofia Sans Condensed"; src: url("assets/fonts/SofiaSansCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Sofia Sans Extra Condensed"; src: url("assets/fonts/SofiaSansExtraCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      /* A hot take on a white notes card, then the proof slapped on top like screenshots:
         the app's own map of Kyiv and Lviv, then three more cities as «Корінець» tickets.
         The card comes back and gets stamped. «Поряд» is paper, never coral. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f1017; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #f3f3f0; font-family: "Sofia Sans Condensed", sans-serif;
        background: radial-gradient(80% 40% at 50% 46%, #1b1b25 0%, #0f1017 70%); }

      /* the notes card */
      #card { position: absolute; left: 110px; top: 560px; width: 860px; border-radius: 40px; background: #f3f3f0; color: #141417;
        padding: 52px 56px 60px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); z-index: 5; }
      #card .lbl { font-family: "Inter", sans-serif; font-weight: 600; font-size: 40px; line-height: 48px; color: #5f5e66; }
      #card .take { margin-top: 18px; font-weight: 800; font-size: 108px; line-height: 108px; letter-spacing: -1px; }
      #stamp { position: absolute; right: 44px; bottom: 40px; padding: 10px 26px 14px; border: 8px solid #ac345e; border-radius: 18px; color: #ac345e;
        font-weight: 800; font-size: 64px; line-height: 64px; letter-spacing: 3px; opacity: 0; transform: rotate(-8deg); }

      /* the proof: screenshots of the map (cropped to the map, no counter) */
      .shot { position: absolute; left: 130px; top: 430px; width: 820px; height: 877px; border-radius: 44px; overflow: hidden; opacity: 0;
        box-shadow: 0 0 0 4px #2e2d35, 0 40px 90px rgba(0, 0, 0, 0.6); }
      .shot img { display: block; width: 820px; height: 877px; }
      #shot-kyiv { z-index: 2; }
      #shot-lviv { z-index: 3; }

      /* three more cities as tickets */
      .tk { position: absolute; left: 150px; width: 780px; height: 210px; opacity: 0; z-index: 4; }
      .tk .body { position: absolute; left: 0; top: 0; width: 560px; height: 210px; border-radius: 32px 0 0 32px; background: #1c1b21; box-shadow: inset 0 0 0 2px #2e2d35;
        display: flex; align-items: center; padding-left: 48px; font-weight: 800; font-size: 112px; line-height: 112px; letter-spacing: -1px; }
      .tk .stub { position: absolute; left: 560px; top: 0; width: 220px; height: 210px; border-radius: 0 32px 32px 0; color: #fff;
        display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 34px; letter-spacing: 2px; }
      .tk .n { position: absolute; left: 542px; width: 36px; height: 36px; border-radius: 50%; background: #15151d; }
      .tk .n.t { top: -18px; } .tk .n.b { bottom: -18px; }
      .tk .perf { position: absolute; left: 558px; top: 22px; bottom: 22px; border-left: 4px dotted rgba(15, 16, 23, 0.6); }
      #tk-odesa { top: 560px; } #tk-dnipro { top: 800px; } #tk-kharkiv { top: 1040px; }

      .plate { position: absolute; left: 120px; width: 840px; display: flex; justify-content: center; opacity: 0; z-index: 6; }
      .plate span { display: block; background: #f3f3f0; color: #141417; border-radius: 16px; padding: 8px 24px 12px; font-weight: 800; font-size: 56px; line-height: 62px; white-space: nowrap; }
      .city { position: absolute; left: 170px; top: 380px; opacity: 0; z-index: 6; }
      .city span { display: block; background: #f3f3f0; color: #141417; border-radius: 16px; padding: 6px 26px 12px; font-weight: 800; font-size: 76px; line-height: 80px; }
      #every { top: 1350px; }
      #hidden { top: 1110px; }
      #q { top: 1130px; }

      #brand { position: absolute; left: 0; top: 640px; width: 1080px; display: flex; flex-direction: column; align-items: center; gap: 26px; opacity: 0; z-index: 7; }
      #brand img { width: 176px; height: 176px; border-radius: 40px; }
      #brand .name { font-weight: 800; font-size: 128px; line-height: 128px; letter-spacing: -1px; color: #f3f3f0; }
      #q { z-index: 7; }

      #grain { position: absolute; z-index: 8; inset: 0; pointer-events: none; opacity: 0.08; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-fps="30" data-width="1080" data-height="1920">
      <div id="card">
        <div class="lbl">непопулярна думка:</div>
        <div class="take">„нема куди піти“<br />— це міф</div>
        <div id="stamp">ПЕРЕВІРЕНО</div>
      </div>

      <div class="shot" id="shot-kyiv"><img src="assets/ui/map-kyiv.jpg" alt="Мапа «Поряд», Київ" /></div>
      <div class="city" id="c-kyiv"><span>київ</span></div>
      <div class="shot" id="shot-lviv"><img src="assets/ui/map-lviv.jpg" alt="Мапа «Поряд», Львів" /></div>
      <div class="city" id="c-lviv"><span>львів</span></div>

      <div class="tk" id="tk-odesa"><div class="body">одеса</div><div class="stub" style="background:#2957ac;color:#2957ac"><svg width="64" height="80" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.4 12 30 12 30s12-9.6 12-18.3C24 5.2 18.6 0 12 0z" fill="#fff"/><circle cx="12" cy="11.5" r="4.6" fill="currentColor"/></svg></div><div class="perf"></div><div class="n t"></div><div class="n b"></div></div>
      <div class="tk" id="tk-dnipro"><div class="body">дніпро</div><div class="stub" style="background:#b15d1a;color:#b15d1a"><svg width="64" height="80" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.4 12 30 12 30s12-9.6 12-18.3C24 5.2 18.6 0 12 0z" fill="#fff"/><circle cx="12" cy="11.5" r="4.6" fill="currentColor"/></svg></div><div class="perf"></div><div class="n t"></div><div class="n b"></div></div>
      <div class="tk" id="tk-kharkiv"><div class="body">харків</div><div class="stub" style="background:#376e33;color:#376e33"><svg width="64" height="80" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.4 12 30 12 30s12-9.6 12-18.3C24 5.2 18.6 0 12 0z" fill="#fff"/><circle cx="12" cy="11.5" r="4.6" fill="currentColor"/></svg></div><div class="perf"></div><div class="n t"></div><div class="n b"></div></div>
      <div class="plate" id="every"><span>у кожному — сотні подій щомісяця</span></div>

      <div class="plate" id="hidden"><span>просто їх не видно в одному місці</span></div>

      <div id="brand"><img src="assets/icon.png" alt="" /><div class="name">Поряд</div></div>
      <div class="plate" id="q"><span>так чи ні? пиши своє місто 👇</span></div>

      <svg id="grain" width="1080" height="1920" aria-hidden="true">
        <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="33" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1080" height="1920" filter="url(#noise)" />
      </svg>

      <!-- music: «Indie Pop (Reverb)» by madstock (Pixabay), a steady groove from 48 s -->
      <audio id="music" src="assets/audio/music.m4a" data-start="0" data-media-start="48" data-duration="13" data-track-index="10" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.6},{&quot;t&quot;:12.4,&quot;v&quot;:0.6},{&quot;t&quot;:13,&quot;v&quot;:0}]}]}"></audio>
      <audio id="sfx-kyiv" src="assets/audio/whoosh.wav" data-start="1.85" data-duration="0.27" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-lviv" src="assets/audio/whoosh.wav" data-start="3.25" data-duration="0.27" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-odesa" src="assets/audio/pin_pop_1.wav" data-start="4.7" data-duration="0.25" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-dnipro" src="assets/audio/pin_pop_1.wav" data-start="5.1" data-duration="0.25" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-kharkiv" src="assets/audio/pin_pop_1.wav" data-start="5.5" data-duration="0.25" data-track-index="13" data-volume="0.4"></audio>
      <audio id="sfx-stamp" src="assets/audio/stamp.wav" data-start="8.55" data-duration="0.5" data-track-index="14" data-volume="0.7"></audio>
      <audio id="sfx-name" src="assets/audio/pin_pop_1.wav" data-start="10.85" data-duration="0.25" data-track-index="11" data-volume="0.35"></audio>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        function plate(id, at, out) {
          tl.fromTo(id, { opacity: 0, y: 12, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2)" }, at);
          if (out != null) tl.to(id, { opacity: 0, duration: 0.15, ease: "power1.in" }, out);
        }
        // a screenshot slapped down: from bigger and higher, lands with a small tilt
        function slap(id, at, rot) {
          tl.fromTo(id, { opacity: 0, scale: 1.18, y: -120, rotation: 0 }, { opacity: 1, scale: 1, y: 0, rotation: rot, duration: 0.32, ease: "power4.out" }, at);
        }

        // ---- 0–1.9: the take, on screen from frame 0 (the cover)
        tl.set("#card", { rotation: -2 }, 0);
        tl.to("#card", { y: -1500, rotation: -12, duration: 0.4, ease: "power3.in" }, 1.75);

        // ---- 1.9–4.6: proof — the app's map of Kyiv, then Lviv on top
        slap("#shot-kyiv", 1.9, 2.5);
        plate("#c-kyiv", 2.05, 3.3);
        slap("#shot-lviv", 3.3, -3);
        plate("#c-lviv", 3.45, 4.7);

        // ---- 4.7–7.9: three more cities as tickets, and the guaranteed claim
        [["#tk-odesa", 4.75, -3], ["#tk-dnipro", 5.15, 2], ["#tk-kharkiv", 5.55, -1.5]].forEach(function (t) {
          tl.fromTo(t[0], { opacity: 0, scale: 1.25, y: -60, rotation: 0 }, { opacity: 1, scale: 1, y: 0, rotation: t[2], duration: 0.26, ease: "power4.out" }, t[1]);
        });
        tl.to(["#shot-kyiv", "#shot-lviv"], { opacity: 0.12, duration: 0.3 }, 4.75);
        plate("#every", 5.9, 7.95);

        // ---- 8.0–10.2: the card comes back and gets stamped; why nobody sees it
        tl.to(["#shot-kyiv", "#shot-lviv", "#tk-odesa", "#tk-dnipro", "#tk-kharkiv"], { opacity: 0, y: 200, duration: 0.3, ease: "power2.in" }, 8.0);
        tl.fromTo("#card", { y: -1500, rotation: 10 }, { y: -120, rotation: -2, duration: 0.4, ease: "power3.out", immediateRender: false }, 8.05);
        tl.fromTo("#stamp", { opacity: 0, scale: 2.2, rotation: -2 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.14, ease: "power4.in" }, 8.45);
        tl.fromTo("#card", { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 1, immediateRender: false }, 8.59);
        plate("#hidden", 8.7, 10.7);

        // ---- 10.75–13: the name and the question, held > 2 s
        tl.to("#card", { opacity: 0, y: -220, duration: 0.25, ease: "power2.in" }, 10.6);
        tl.fromTo("#brand", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 10.8);
        plate("#q", 10.9);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
