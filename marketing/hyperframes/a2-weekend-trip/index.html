<html lang="uk">

    <meta charset="UTF-8">

    <title>A2 · вихідні в іншому місті — нічний потяг, 14 с, 9:16</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- the split-flap engine every board in this film runs on (from the registry block split-flap-board) -->
    <script src="assets/flap.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      /* Night train: navy #0E1626, amber #F2B544, paper #F4EFE2. Coral #E0582F = the name «Поряд», nothing else. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e1626; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #0e1626 0%, #0e1626 55%, #0a101c 100%); font-family: "Inter", sans-serif; color: #f4efe2; }

      /* split-flap tiles, shared by every board (assets/flap.js builds them) */
      .flap-cell { position: relative; flex: 0 0 auto; perspective: 700px; border-radius: 7px; background: #060a13; box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(242, 181, 68, 0.1); }
      .flap-face { position: absolute; left: 0; width: 100%; height: 50%; overflow: hidden; background: linear-gradient(180deg, #1c2841 0%, #152036 100%); }
      .flap-top, .flap-leaf-a { top: 0; border-radius: 7px 7px 0 0; }
      .flap-bot, .flap-leaf-b { top: 50%; border-radius: 0 0 7px 7px; background: linear-gradient(180deg, #111a2c 0%, #19243b 100%); }
      .flap-leaf-a { transform-origin: 50% 100%; z-index: 3; backface-visibility: hidden; }
      .flap-leaf-b { transform-origin: 50% 0%; z-index: 3; backface-visibility: hidden; }
      .flap-glyph { position: absolute; left: 0; width: 100%; display: block; text-align: center; font-family: "Inter", sans-serif; font-weight: 600; white-space: pre; }
      .flap-seam { position: absolute; left: 0; top: 50%; width: 100%; height: 2px; margin-top: -1px; background: #04070d; z-index: 4; }

      /* whip-pan-cut (registry component), pasted: both scenes ride ONE strip, the board docked
         on stage and the route one frame-width to the right, so the seam velocity matches by construction */
      #wpc-clip { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
      #wpc-strip { position: absolute; inset: 0; filter: url("#wpc-blur"); }
      #wpc-after { position: absolute; left: 1080px; top: 0; width: 1080px; height: 1920px; }
      #wpc-seam { position: absolute; z-index: 3; top: 0; left: 1080px; width: 4px; height: 1920px; margin-left: -2px; background: #f2b544; opacity: 0; }
      #phone { z-index: 2; }
      #signs { z-index: 3; }
      #cta { z-index: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-fps="30" data-width="1080" data-height="1920">
      <div id="wpc-clip">
        <svg width="0" height="0" aria-hidden="true" style="position: absolute">
          <defs>
            <filter id="wpc-blur" x="-50%" y="-20%" width="200%" height="140%">
              <feGaussianBlur id="wpc-blur-node" in="SourceGraphic" stdDeviation="0 0"></feGaussianBlur>
            </filter>
          </defs>
        </svg>
        <div id="wpc-strip">
          <!-- hook: the departure board (checklist, then «А ЩО ТАМ РОБИТИ?») -->

          <!-- bridge → name: the line map, the train Київ → Львів, the ticket, then the five cities and «Поряд» -->
          <div id="wpc-after"><section id="route" data-composition-id="route" data-composition-src="compositions/route.html" data-start="3.75" data-duration="10.25" data-track-index="2" data-width="1080" data-height="1920"></section></div>
          <div id="wpc-seam"></div>
        </div>
      </div>

      <!-- amber split-flap captions + the КИЇВ → ЛЬВІВ row + the turn line -->
      <section id="signs" data-composition-id="signs" data-composition-src="compositions/signs.html" data-start="5.7" data-duration="6.4" data-track-index="4" data-width="1080" data-height="1920"></section>
      <!-- end card text around the «Поряд» tile: bait, the slogan flapping in under it, stores -->

      <!-- music: the shared chill-hop bed (Pixabay, «Cozy Cafe Moments», 88 bpm) from its body (10.08 s) -->
      <audio id="music" src="assets/audio/music.m4a" data-start="0" data-media-start="10.08" data-duration="14" data-track-index="10" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.356},{&quot;t&quot;:5.5,&quot;v&quot;:0.356},{&quot;t&quot;:5.8,&quot;v&quot;:0.3},{&quot;t&quot;:10.2,&quot;v&quot;:0.3},{&quot;t&quot;:10.4,&quot;v&quot;:0.356},{&quot;t&quot;:13.4,&quot;v&quot;:0.356},{&quot;t&quot;:14,&quot;v&quot;:0.0}]}]}"></audio>
      <!-- hook: flap clatter row by row, ticks land, the spinning cell, the verdict -->

      <audio id="sfx-tick-1" src="assets/audio/ui_tick.wav" data-start="0.62" data-duration="0.1" data-track-index="12" data-volume="0.38"></audio>
      <audio id="sfx-flap-2" src="assets/audio/ui_tick.wav" data-start="0.35" data-duration="0.1" data-track-index="11" data-volume="0.2"></audio>
      <audio id="sfx-tick-2" src="assets/audio/ui_tick.wav" data-start="0.92" data-duration="0.1" data-track-index="12" data-volume="0.38"></audio>
      <audio id="sfx-flap-3" src="assets/audio/ui_tick.wav" data-start="0.65" data-duration="0.1" data-track-index="11" data-volume="0.2"></audio>
      <audio id="sfx-tick-3" src="assets/audio/ui_tick.wav" data-start="1.22" data-duration="0.1" data-track-index="12" data-volume="0.38"></audio>
      <audio id="sfx-flap-4" src="assets/audio/ui_tick.wav" data-start="0.95" data-duration="0.1" data-track-index="11" data-volume="0.2"></audio>
      <audio id="sfx-spin-1" src="assets/audio/ui_tick.wav" data-start="1.55" data-duration="0.1" data-track-index="11" data-volume="0.14"></audio>
      <audio id="sfx-spin-2" src="assets/audio/ui_tick.wav" data-start="1.9" data-duration="0.1" data-track-index="11" data-volume="0.14"></audio>
      <audio id="sfx-spin-3" src="assets/audio/ui_tick.wav" data-start="2.25" data-duration="0.1" data-track-index="11" data-volume="0.14"></audio>
      <audio id="sfx-verdict" src="assets/audio/pin_pop_1.wav" data-start="2.5" data-duration="0.25" data-track-index="13" data-volume="0.36"></audio>

      <!-- bridge: the whip on the 4.0 hit, the train arrives, the ticket lands -->

      <audio id="sfx-pocket" src="assets/audio/whoosh.wav" data-start="5.62" data-duration="0.27" data-track-index="14" data-volume="0.26"></audio>
      <!-- proof: captions flap, taps, the city flips -->
      <audio id="sfx-cap-1" src="assets/audio/ui_tick.wav" data-start="5.85" data-duration="0.1" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-tap-1" src="assets/audio/ui_tick.wav" data-start="6.5" data-duration="0.1" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-tap-2" src="assets/audio/ui_tick.wav" data-start="7.25" data-duration="0.1" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-city-a" src="assets/audio/ui_tick.wav" data-start="7.28" data-duration="0.1" data-track-index="11" data-volume="0.24"></audio>
      <audio id="sfx-city-b" src="assets/audio/ui_tick.wav" data-start="7.38" data-duration="0.1" data-track-index="11" data-volume="0.24"></audio>
      <audio id="sfx-city" src="assets/audio/pin_pop_1.wav" data-start="7.5" data-duration="0.25" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-cap-2" src="assets/audio/ui_tick.wav" data-start="7.85" data-duration="0.1" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-tap-3" src="assets/audio/ui_tick.wav" data-start="8.65" data-duration="0.1" data-track-index="12" data-volume="0.4"></audio>

      <!-- name: back into the pocket, five cities roll, the dots converge, the flap settles -->
      <audio id="sfx-out" src="assets/audio/whoosh.wav" data-start="10.22" data-duration="0.27" data-track-index="14" data-volume="0.26"></audio>
      <audio id="sfx-roll-1" src="assets/audio/ui_tick.wav" data-start="10.2" data-duration="0.1" data-track-index="11" data-volume="0.22"></audio>

      <audio id="sfx-roll-3" src="assets/audio/ui_tick.wav" data-start="10.98" data-duration="0.1" data-track-index="11" data-volume="0.22"></audio>

      <audio id="sfx-free" src="assets/audio/ui_tick.wav" data-start="12.9" data-duration="0.1" data-track-index="12" data-volume="0.35"></audio>
    </div>

    <script>
      // The root owns the whip-pan-cut strip (registry component, pasted); every other move lives in the scenes.
      (function () {
        var tl = gsap.timeline({ paused: true });
        var WHIP_AT = 3.75, WHIP = 0.55, PEAK_BLUR = 16; // mid-whip = 4.025, on the 4.0 hit
        var node = document.getElementById("wpc-blur-node");
        var blur = { v: 0 };
        function writeBlur() { node.setAttribute("stdDeviation", blur.v.toFixed(2) + " 0"); }
        writeBlur();
        tl.fromTo("#wpc-strip", { x: 0 }, { x: -1080, duration: WHIP, ease: "power3.inOut" }, WHIP_AT);
        tl.fromTo(blur, { v: 0 }, { v: PEAK_BLUR, duration: WHIP / 2, ease: "power3.in", onUpdate: writeBlur }, WHIP_AT);
        tl.to(blur, { v: 0, duration: WHIP / 2, ease: "power3.out", onUpdate: writeBlur }, WHIP_AT + WHIP / 2);
        tl.fromTo("#wpc-seam", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, WHIP_AT);
        tl.to("#wpc-seam", { opacity: 0, duration: 0.15, ease: "power1.in" }, WHIP_AT + WHIP - 0.15);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
