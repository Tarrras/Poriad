<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #card-root { position: absolute; inset: 0; pointer-events: none; }
        /* the «Вечір джазу» card, cut from the same screenshot the phone shows (x 162–1157, y 1908–2244 px, 0.76382 px per px) */
        #card-move { position: absolute; left: 160px; top: 800px; width: 760px; height: 256.64px; transform-origin: 0 0; }
        #card-shadow { position: absolute; inset: 0; border-radius: 53.5px; box-shadow: 0 50px 120px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08); opacity: 0; }
        #card-face { position: absolute; inset: 0; border-radius: 53.5px; overflow: hidden; background: #f5f5f7; }
        /* natural-size crop scaled down, so the picture's box is exactly the card */
        #card-face img { position: absolute; left: 0; top: 0; width: 995px; height: 336px; object-fit: none; object-position: -162px -1908px; transform: scale(0.76382); transform-origin: 0 0; display: block; }
      </style>

      <div data-hf-id="hf-d7kc" id="card-root" data-composition-id="card" data-width="1080" data-height="1920">
        <div data-hf-id="hf-o1uz" id="card-move">
          <div data-hf-id="hf-i8q8" id="card-shadow"></div>
          <div data-hf-id="hf-4r0v" id="card-face"><img data-hf-id="hf-608p" src="assets/ui/map-lviv-weekend.png" alt="Вечір джазу, у неділю, 18:00, Афіша · Concert.ua"></div>
        </div>
      </div>

      <script>
        (() => {
          // Carrier proof → turn (local s; the section starts at 10.15 root, the proof's last camera has landed at 10.05).
          // The lift (10.3 → 11.25 root) crosses the seam (10.7) at full speed and lands with the brand reveal.
          const T = { lift: 0.15, liftEnd: 1.1, out: 1.5, end: 1.85 };
          // = the card's rect inside the phone at the proof's last camera (s 2.25 → 0.87687 canvas px per screenshot px, centre 540, 625)
          const MATCH = { x: -56.24, y: -322.31, scale: 1.148 };
          const tl = gsap.timeline({ paused: true });
          // lifts out of the phone while the phone falls away, lands in the turn
          tl.fromTo("#card-move", { ...MATCH }, { x: 0, y: 0, scale: 1, duration: T.liftEnd - T.lift, ease: "expo.inOut", immediateRender: true }, T.lift);
          tl.fromTo("#card-shadow", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T.lift + 0.1);
          // cut-the-curve: leaves left with the turn's line
          tl.to("#card-move", { x: -230, opacity: 0, duration: T.end - T.out, ease: "power4.in" }, T.out);
          window.__timelines["card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
