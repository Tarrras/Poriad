      <script>
        (() => {
          // ═══ COPY (script C1) and TIMES (s, on the 130.4 BPM grid: beat 0.46, first beat 0.1) ═══
          const COPY = {
            ask: [["йдемо", "в пт"], ["на стендап?", "😏"]],
            friends: ["М", "О", "Д"],
            replies: [
              // three above the verdict, three below; centres alternate 50 px either side of x 540
              { from: 0, text: "я пас", cx: 490, top: 430 },
              { from: 1, text: "стендап — це кринж", cx: 590, top: 545, rev: true },
              { from: 2, text: "ой а я в пт не можу 🙃", cx: 490, top: 660 },
              { from: 0, text: "може наступного разу", cx: 590, top: 1045, rev: true },
              { from: 1, text: "давай краще в кіно", cx: 490, top: 1160 },
              { from: 2, text: "скинь потім відео 😅", cx: 590, top: 1275, rev: true },
            ],
            claim: "ніхто не йде",
            turn: [["давай", "знайдемо"], ["тих,", "хто", "теж", "іде"]],
            // what the badges become: the event (where), the real «Шукаю компанію» button (the match cut into the phone)
            // and how it works (site copy, poriad.app). Crops are screenshot px [x, y, w, h]
            ui: [
              { chip: true, top: 610, icon: "comedy", tint: "#a07813", title: "Великий Стендап на Подолі", sub: "у пʼятницю · 19:30" },
              { src: "assets/ui/c1-1-detail.png", crop: [84, 2332, 1036, 150], r: 75, left: 140, top: 822, w: 800 },
              { chip: true, top: 990, num: "3", title: "хто хоче — надсилає запит", sub: "ти вирішуєш, кого взяти" },
            ],
          };
          const T = {
            ask: [0.1, 0.25, 0.4, 0.56], zoom: 0.56, swap: 1.02,
            pills: [1.02, 1.16, 1.3, 1.44, 1.58, 1.72], cross: [1.44, 1.58, 1.72], claim: 1.94, cloudExit: 2.5, cut: 2.86,
            words: [2.9, 3.02, 3.14, 3.24, 3.34, 3.44], split1: 3.62, split2: 3.92, fade: 4.2, step: 4.5, lurch: 4.8, end: 5.2,
          };

          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const el = (tag, cls, text) => {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text != null) n.textContent = text;
            return n;
          };
          // Directional smear: a one-axis gaussian blur that dies (or grows) over a few frames.
          const NS = "http://www.w3.org/2000/svg";
          let fid = 0;
          const smear = (node, [sx, sy], at, dur, grow = false) => {
            const f = document.createElementNS(NS, "filter");
            f.id = `hook-smear-${fid++}`;
            ["x", "y"].forEach((k) => f.setAttribute(k, "-50%"));
            ["width", "height"].forEach((k) => f.setAttribute(k, "200%"));
            const b = f.appendChild(document.createElementNS(NS, "feGaussianBlur"));
            b.setAttribute("stdDeviation", "0 0");
            $("#hook-filters").appendChild(f);
            node.style.filter = `${node.style.filter || ""} url(#${f.id})`.trim();
            const on = { attr: { stdDeviation: `${sx} ${sy}` } };
            const off = { attr: { stdDeviation: "0 0" } };
            if (grow) tl.fromTo(b, off, { ...on, duration: dur, ease: "power2.in" }, at);
            // a pulse: sharp before `at` (even when seeking back), peaks at `at`, dies over `dur`
            else {
              tl.fromTo(b, off, { ...on, duration: 0.02, ease: "none" }, at);
              tl.to(b, { ...off, duration: dur, ease: "power2.out" }, at + 0.02);
            }
          };
          // Left-anchored type-on: every glyph keeps its place, so the left edge never moves.
          const typeOn = (parent, text, at, per) => {
            const glyphs = Array.from(text).map((ch) => parent.appendChild(el("span", "g", ch)));
            glyphs.forEach((g, i) => tl.set(g, { opacity: 1 }, at + i * per));
            return glyphs.length;
          };

          // ── 1. the ask: each word rises with a vertical smear, then the phrase rushes at the camera ──
          let w = 0;
          COPY.ask.forEach((row) => {
            const r = $("#hook-ask-rows").appendChild(el("div", "ask-row"));
            row.forEach((word) => {
              const n = r.appendChild(el("span", "ask-word", word));
              const at = T.ask[w++];
              tl.fromTo(n, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
              smear(n, [0, 14], at, 0.22);
            });
          });
          tl.fromTo("#hook-ask", { scale: 1 }, { scale: 1.3, duration: T.swap - T.zoom, ease: "power2.in" }, T.zoom);
          smear($("#hook-ask"), [10, 0], T.zoom + 0.2, T.swap - T.zoom - 0.2, true);
          tl.set("#hook-ask", { autoAlpha: 0 }, T.swap); // hard swap

          // ── 2. the replies land as pills, the verdict types on; the whole cloud rises and lifts out ──
          tl.fromTo("#hook-cloud", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: "none" }, T.swap);
          // the cloud keeps growing (fast, then easing) for its whole life, and rises as it grows
          tl.fromTo("#hook-cloud-scale", { scale: 0.72 }, { scale: 1, duration: T.cut - T.swap, ease: "power1.out" }, T.swap);
          smear($("#hook-cloud-scale"), [22, 0], T.swap, 0.3);
          tl.fromTo("#hook-cloud-carry", { y: 0 }, { y: -110, duration: T.cut - T.swap, ease: "none" }, T.swap);
          COPY.replies.forEach((r, i) => {
            const row = $("#hook-cloud-spin").appendChild(el("div", "pill-row"));
            row.style.left = `${r.cx - 540}px`;
            row.style.top = `${r.top}px`;
            const p = row.appendChild(el("div", r.rev ? "pill rev" : "pill"));
            p.appendChild(el("span", `av av-${r.from}`, COPY.friends[r.from]));
            p.appendChild(el("span", "", r.text));
            tl.fromTo(p, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.pills[i]);
            smear(p, [0, 12], T.pills[i], 0.2);
          });
          // each friend is crossed out with their second excuse, then the verdict types on
          COPY.friends.forEach((f, i) => {
            const a = $("#hook-tally").appendChild(el("div", "t-av"));
            const face = a.appendChild(el("div", `t-face av-${i}`, f));
            const bar = a.appendChild(el("div", "t-cross")).appendChild(el("i"));
            tl.fromTo(face, { opacity: 1, filter: "grayscale(0)" }, { opacity: 0.4, filter: "grayscale(1)", duration: 0.3, ease: "power2.out" }, T.cross[i]);
            tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, T.cross[i]);
          });
          // the verdict lands word by word, left edge fixed
          COPY.claim.split(" ").forEach((word, i, all) => {
            const span = $("#hook-claim").appendChild(el("span", "g", word));
            if (i < all.length - 1) $("#hook-claim").appendChild(document.createTextNode(" "));
            tl.set(span, { opacity: 1 }, T.claim + i * 0.12);
          });
          tl.to("#hook-cloud-out", { y: -320, duration: T.cut - T.cloudExit, ease: "power3.in" }, T.cloudExit);
          tl.to("#hook-cloud-out", { opacity: 0, duration: 0.14, ease: "power1.in" }, T.cut - 0.15);
          smear($("#hook-cloud-out"), [0, 30], T.cloudExit + 0.1, T.cut - T.cloudExit - 0.1, true);
          tl.set("#hook-cloud", { autoAlpha: 0 }, T.cut); // hard cut

          // ── 3. the turn: words assemble, split around the badges, the badges step into the app's own controls ──
          tl.fromTo("#hook-turn", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: "none" }, T.cut);
          let k = 0;
          COPY.turn.forEach((line, li) => line.forEach((word) => {
            const w = $(li ? "#hook-l2" : "#hook-l1").appendChild(el("span", "hw", word));
            const at = T.words[k++];
            // each word lands whole, tinted violet, and settles to ink
            tl.fromTo(w, { opacity: 0, y: 50, color: "#a58cff" }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at);
            tl.to(w, { color: "#f5f5f7", duration: 0.12, ease: "none" }, at + 0.17);
            smear(w, [0, 10], at, 0.18);
          }));
          // split 1: the lines part and the company badge grows in the gap
          tl.fromTo("#hook-l1", { y: 0 }, { y: -100, duration: 0.2, ease: "power3.out" }, T.split1);
          tl.fromTo("#hook-l2", { y: 0 }, { y: 100, duration: 0.2, ease: "power3.out" }, T.split1);
          tl.fromTo("#hook-badge-a", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" }, T.split1 + 0.02);
          // split 2: «3» slides out from behind it, a link joins them, the lines part further
          tl.to("#hook-badge-a", { x: -88, duration: 0.18, ease: "power3.out" }, T.split2);
          tl.fromTo("#hook-badge-b", { opacity: 0, x: 0, scale: 0.6 }, { opacity: 1, x: 88, scale: 1, duration: 0.18, ease: "power3.out" }, T.split2);
          tl.fromTo("#hook-link", { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power3.out" }, T.split2 + 0.08);
          tl.to("#hook-l1", { y: -190, duration: T.step - T.split2, ease: "power2.out" }, T.split2);
          tl.to("#hook-l2", { y: 190, duration: T.step - T.split2, ease: "power2.out" }, T.split2);
          // the words fade while the badges grow, accelerating into the step
          tl.to("#hook-head", { opacity: 0, duration: T.step - T.fade - 0.02, ease: "power1.in" }, T.fade);
          tl.fromTo("#hook-badges", { scale: 1 }, { scale: 1.4, duration: T.step - T.fade, ease: "power2.in" }, T.fade);
          tl.set("#hook-turn", { autoAlpha: 0 }, T.step);

          // one-frame step: the badges are now the controls — «Шукаю компанію», «скільки людей: 3», the invite line
          tl.fromTo("#hook-cluster", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: "none" }, T.step);
          // icons from poriad.app (img/icons.svg), 24-unit grid
          const ICONS = {
            comedy: "M12 3 L12 3 C13.381 3 14.5 4.119 14.5 5.5 L14.5 10.5 C14.5 11.881 13.381 13 12 13 L12 13 C10.619 13 9.5 11.881 9.5 10.5 L9.5 5.5 C9.5 4.119 10.619 3 12 3 Z M6.8 10 C6.8 13.2 9.1 15.5 12 15.5 C14.9 15.5 17.2 13.2 17.2 10 M12 15.5 L12 19.5 M8.8 19.5 L15.2 19.5",
          };
          const chip = (u) => {
            const row = $("#hook-cl-lurch").appendChild(el("div", "chip-row"));
            row.style.top = `${u.top}px`;
            const c = row.appendChild(el("div", "chip"));
            const ico = c.appendChild(el("div", u.num ? "chip-ico num" : "chip-ico", u.num ?? null));
            if (u.icon) {
              ico.style.background = u.tint;
              ico.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[u.icon]}" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
            }
            const txt = c.appendChild(el("div"));
            txt.appendChild(el("b", "", u.title));
            txt.appendChild(el("small", "", u.sub));
            return c;
          };
          COPY.ui.forEach((u, i) => {
            const at = T.step + i * 0.06;
            if (u.chip) {
              const c = chip(u);
              const flash = c.appendChild(el("div", "ui-flash"));
              tl.fromTo(c, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" }, at);
              tl.fromTo(flash, { opacity: 0.7 }, { opacity: 0, duration: 0.2, ease: "power2.out" }, at);
              return;
            }
            const [cx, cy, cw, ch] = u.crop;
            const sc = u.w / cw;
            const card = $("#hook-cl-lurch").appendChild(el("div", "ui-card"));
            Object.assign(card.style, { left: `${u.left}px`, top: `${u.top}px`, width: `${u.w}px`, height: `${(ch * sc).toFixed(1)}px`, borderRadius: `${(u.r * sc).toFixed(1)}px`, transformOrigin: "50% 50%" });
            const img = card.appendChild(el("img"));
            img.src = u.src;
            img.alt = "";
            Object.assign(img.style, { width: `${cw}px`, height: `${ch}px`, objectPosition: `-${cx}px -${cy}px`, transform: `scale(${sc.toFixed(5)})` });
            const flash = card.appendChild(el("div", "ui-flash"));
            tl.fromTo(card, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" }, at);
            tl.fromTo(flash, { opacity: 0.7 }, { opacity: 0, duration: 0.2, ease: "power2.out" }, at);
          });
          // world camera: a steady push, then a lurch onto the button that is still accelerating at the cut
          tl.fromTo("#hook-cl-drift", { scale: 1 }, { scale: 1.12, duration: T.end - T.step, ease: "none" }, T.step);
          tl.fromTo("#hook-cl-lurch", { scale: 1 }, { scale: 1.3, duration: T.end - T.lurch, ease: "power3.in" }, T.lurch); // the phone matches this size
          smear($("#hook-cluster"), [14, 4], T.lurch + 0.15, T.end - T.lurch - 0.15, true);

          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
