<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>G19 · кубики — TikTok/Reels, 10.8 с, 9:16</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Sofia Sans Condensed"; src: url("assets/fonts/SofiaSansCondensed-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Sofia Sans Condensed"; src: url("assets/fonts/SofiaSansCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      /* G-series (10.11): a text-free Seedance plate (Higgsfield, 480p upscaled) (sped up ×1.25) carries the metaphor — toy blocks assemble a gathering spot by themselves, then a whole neighbourhood — and everything readable is ours: captions on night labels, end card by
         _material/END-CARD.md. «Поряд» is paper, no coral, no «Буде з ким» (27.10). «сотні» not a number (09.10). */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f0f13; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #f3f3f0; font-family: "Sofia Sans Condensed", sans-serif; background: #0f0f13; }
      .clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #plate, #still { object-fit: cover; }
      #still { opacity: 0; }
      #night { position: absolute; inset: 0; background: #0f0f13; opacity: 0; }

      .cap { position: absolute; left: 160px; width: 760px; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; }
      .cap span { display: block; padding: 10px 30px 16px; border-radius: 22px; background: #0f0f13; font-weight: 800; font-size: 92px; line-height: 96px; letter-spacing: -1px; white-space: nowrap; }
      .cap { top: 330px; }

      #card { position: absolute; inset: 0; }
      #bait { position: absolute; left: 160px; top: 300px; width: 760px; text-align: center; font-weight: 700; font-size: 60px; line-height: 66px; opacity: 0; }
      #icon { position: absolute; left: 452px; top: 560px; width: 176px; height: 176px; border-radius: 40px; opacity: 0; }
      #word { position: absolute; left: 0; top: 770px; width: 1080px; text-align: center; font-weight: 800; font-size: 128px; line-height: 128px; letter-spacing: -1px; opacity: 0; }
      #line { position: absolute; left: 0; top: 936px; width: 1080px; text-align: center; font-weight: 700; font-size: 44px; line-height: 50px; color: #a6a5ad; opacity: 0; }
      #store { position: absolute; left: 0; top: 1096px; width: 1080px; display: flex; flex-direction: column; align-items: center; visibility: hidden; }
      #free { font-family: "Inter", sans-serif; font-weight: 600; font-size: 34px; line-height: 40px; color: #f3f3f0; margin-bottom: 40px; }
      #badges { display: flex; gap: 32px; }
      /* official badges: untouched files, both 104 px tall, hard cut in, still to the end */
      #badges img { display: block; height: 104px; width: auto; }
      #store .tm { margin-top: 30px; text-align: center; font-family: "Inter", sans-serif; font-weight: 400; font-size: 20px; line-height: 28px; color: #96959e; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.8" data-fps="30" data-width="1080" data-height="1920">
      <video id="plate" class="clip" src="assets/plate.mp4" muted playsinline data-start="0" data-duration="10.8"></video>
      <div id="night"></div>

      <div class="cap" id="cap1"><span>нема події</span><span>до смаку?</span></div>
      <div class="cap" id="cap2"><span>збери свою</span></div>
      <div class="cap" id="cap3"><span>настолки, пікнік,</span><span>кіно у дворі</span></div>
      <div class="cap" id="cap4"><span>і постав її</span><span>на мапу міста</span></div>
      
      <div id="card">
        <div id="bait">яку подію зібрав би ти? 👇</div>
        <img id="icon" src="assets/icon.png" alt="" />
        <div id="word">Поряд</div>
        <div id="line">Афіша міста на одній мапі</div>
        <div id="store">
          <div id="free">безкоштовно</div>
          <div id="badges">
            <img src="assets/appstore-badge-uk.svg" alt="Завантажте в App Store" />
            <img src="assets/googleplay-badge-uk.svg" alt="Завантажте з Google Play" />
          </div>
          <div class="tm" data-layout-ignore>
            <div>Apple, логотип Apple і App Store є торговельними марками Apple Inc.</div>
            <div>Google Play і логотип Google Play є торговельними марками Google LLC.</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // fast cut (10.11, «повільний темп»): every caption is a hard cut with a pop and a punch-in on the plate
        tl.set("#cap1", { opacity: 1 }, 0);
        tl.set("#cap1", { opacity: 0 }, 1.5);
        tl.set("#plate", { scale: 1 }, 1.6);
        tl.fromTo("#cap2", { opacity: 1, scale: 0.82 }, { scale: 1, duration: 0.16, ease: "back.out(2.2)", immediateRender: false }, 1.6);
        tl.set("#cap2", { opacity: 0 }, 3.9);
        tl.set("#plate", { scale: 1 }, 4.0);
        tl.fromTo("#cap3", { opacity: 1, scale: 0.82 }, { scale: 1, duration: 0.16, ease: "back.out(2.2)", immediateRender: false }, 4.0);
        tl.set("#cap3", { opacity: 0 }, 6.3);
        tl.set("#plate", { scale: 1 }, 6.4);
        tl.fromTo("#cap4", { opacity: 1, scale: 0.82 }, { scale: 1, duration: 0.16, ease: "back.out(2.2)", immediateRender: false }, 6.4);
        tl.set("#cap4", { opacity: 0 }, 7.95);

        // 8: splash in reverse — the still-moving clip closes down into the icon tile, the icon lands in its place, then the card builds on solid night
        tl.fromTo("#plate", { clipPath: "inset(0px 0px 0px 0px round 0px)" }, { clipPath: "inset(560px 452px 1184px 452px round 40px)", duration: 0.7, ease: "power3.inOut", immediateRender: false }, 8.000);
        tl.fromTo("#icon", { opacity: 0, scale: 1 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, 8.620);
        tl.to("#icon", { scale: 1.14, duration: 0.12, ease: "power2.out" }, 8.700);
        tl.to("#icon", { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 8.820);
        tl.set("#plate", { opacity: 0 }, 8.780);
        tl.fromTo("#word", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 8.860);
        tl.fromTo("#line", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 9.020);
        tl.fromTo("#bait", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, 9.120);
        tl.set("#store", { visibility: "visible" }, 9.300);
        // still from 9.30 to the end

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
