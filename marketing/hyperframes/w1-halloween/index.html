<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>W1 · куди на Хелловін сьогодні — TikTok, 14.9 с, 9:16, без звуку</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Sofia Sans Condensed"; src: url("assets/fonts/SofiaSansCondensed-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Sofia Sans Condensed"; src: url("assets/fonts/SofiaSansCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Sofia Sans Extra Condensed"; src: url("assets/fonts/SofiaSansExtraCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      /* A Halloween top-5 for today: five dashed ticket slots are there on frame 0 (the cover),
         each fills with a real event by a slam, 5 → 1, on a steady 1.5 s grid (no music: the
         re-cut gets TikTok's own sound). Pumpkin #B15D1A is the accent; «Поряд» is paper, never coral. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f1017; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #f3f3f0; font-family: "Sofia Sans Condensed", sans-serif;
        background: radial-gradient(75% 40% at 50% 46%, #241a17 0%, #0f1017 72%); }
      #shake { position: absolute; inset: 0; }

      .plate { position: absolute; left: 90px; width: 900px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 6; }
      .plate span { display: block; background: #f3f3f0; color: #141417; border-radius: 16px; padding: 8px 26px 12px; font-weight: 800; font-size: 64px; line-height: 68px; white-space: nowrap; }
      .plate span.pk { background: #b15d1a; color: #fff; }
      #head { top: 120px; }
      #head span { font-size: 76px; line-height: 80px; }

      /* five slots; the dashed ghost is visible from frame 0, the ticket slams into it */
      .slot { position: absolute; left: 110px; width: 880px; height: 200px; }
      .ghost { position: absolute; inset: 0; border: 4px dashed #3a3942; border-radius: 30px; }
      .num { position: absolute; left: -46px; top: 50px; width: 96px; height: 96px; border-radius: 50%; background: #b15d1a; color: #fff; z-index: 3;
        display: flex; align-items: center; justify-content: center; font-family: "Sofia Sans Extra Condensed", sans-serif; font-weight: 800; font-size: 72px; line-height: 72px;
        box-shadow: 0 0 0 6px #0f1017; }
      .tk { position: absolute; inset: 0; opacity: 0; }
      .tk .body { position: absolute; left: 0; top: 0; width: 650px; height: 200px; border-radius: 30px 0 0 30px; background: #1c1b21; box-shadow: inset 0 0 0 2px #2e2d35; padding: 26px 30px 0 74px; }
      .tk .title { font-weight: 800; font-size: 50px; line-height: 54px; letter-spacing: -0.3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-bottom: 4px; }
      .tk .venue { position: absolute; left: 74px; right: 24px; bottom: 22px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 28px; line-height: 34px; color: #a6a5ad; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tk .stub { position: absolute; left: 650px; top: 0; width: 230px; height: 200px; border-radius: 0 30px 30px 0; color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
      .tk .g { font-weight: 800; font-size: 28px; letter-spacing: 2px; }
      .tk .time { font-family: "Sofia Sans Extra Condensed", sans-serif; font-weight: 800; font-size: 84px; line-height: 80px; }
      .tk .perf { position: absolute; left: 648px; top: 20px; bottom: 20px; border-left: 4px dotted rgba(15, 16, 23, 0.6); }
      .tk .n { position: absolute; left: 632px; width: 36px; height: 36px; border-radius: 50%; background: #17141a; }
      .tk .n.t { top: -18px; } .tk .n.b { bottom: -18px; }
      .stk { font-size: 44px; line-height: 46px; opacity: 0; }
      #slot1 .tk .body { box-shadow: inset 0 0 0 4px #b15d1a; }

      #ghostie { position: absolute; left: -140px; top: 1470px; font-size: 90px; line-height: 90px; opacity: 0.85; z-index: 1; }

      /* the map, cropped above its counter and the card row */
      #map { position: absolute; left: 0; top: 0; width: 1080px; height: 1504px; opacity: 0; z-index: 5; }
      #mapfade { position: absolute; left: 0; top: 1200px; width: 1080px; height: 720px; background: linear-gradient(180deg, rgba(15, 16, 23, 0) 0%, #0f1017 42%); opacity: 0; z-index: 5; }
      #more { top: 1290px; opacity: 0; }

      /* end card (END-CARD.md grid, «Корінець» type like ad1-speedrun) */
      #end { position: absolute; inset: 0; opacity: 0; z-index: 9; background: radial-gradient(70% 45% at 50% 45%, #241a17 0%, #0f1017 72%); }
      #bait { position: absolute; left: 160px; top: 296px; width: 760px; text-align: center; font-weight: 700; font-size: 60px; line-height: 66px; opacity: 0; }
      #brand { position: absolute; left: 160px; top: 520px; width: 760px; height: 510px; opacity: 0; }
      #brand .body { position: absolute; left: 0; top: 0; width: 760px; height: 385px; border-radius: 36px 36px 0 0; background: #1c1b21; box-shadow: inset 0 0 0 2px #2e2d35; }
      #brand .icon { position: absolute; left: 292px; top: 40px; width: 176px; height: 176px; border-radius: 40px; }
      #brand .name { position: absolute; left: 0; top: 248px; width: 760px; text-align: center; font-weight: 800; font-size: 128px; line-height: 128px; letter-spacing: -1px; color: #f3f3f0; }
      #brand .stub { position: absolute; left: 0; top: 385px; width: 760px; height: 125px; border-radius: 0 0 36px 36px; background: #f3f3f0; color: #141417;
        display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 44px; }
      #brand .perf { position: absolute; left: 30px; right: 30px; top: 384px; border-top: 3px dotted rgba(243, 243, 240, 0.45); }
      #brand .bn { position: absolute; top: 365px; width: 40px; height: 40px; border-radius: 50%; background: #15151d; }
      #free { position: absolute; left: 0; top: 1104px; width: 1080px; text-align: center; font-family: "Inter", sans-serif; font-weight: 600; font-size: 34px; line-height: 40px; color: #e08a45; opacity: 0; }
      #store { position: absolute; left: 0; top: 1176px; width: 1080px; display: flex; flex-direction: column; align-items: center; opacity: 0; }
      #badges { display: flex; gap: 32px; }
      /* official badges: untouched files, both 104 px tall, no transform/filter/shadow */
      #badges img { display: block; height: 104px; width: auto; }
      #store .tm { margin-top: 22px; text-align: center; font-family: "Inter", sans-serif; font-weight: 400; font-size: 20px; line-height: 28px; color: #96959e; white-space: nowrap; }

      #grain { position: absolute; inset: 0; z-index: 10; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.9" data-fps="30" data-width="1080" data-height="1920">
      <div id="shake">
        <div class="plate" id="head"><span>куди на Хелловін</span><span class="pk">сьогодні? 🎃</span></div>
        <div id="list"></div>
        <div id="ghostie" data-layout-allow-overflow>👻</div>
        <img id="map" src="assets/ui/map.jpg" alt="Мапа «Поряд», Київ" />
        <div id="mapfade"></div>
        <div class="plate" id="more"><span>і ще сотні подій — на мапі</span></div>
      </div>

      <div id="end">
        <div id="bait">а ти куди сьогодні? 👇</div>
        <div id="brand">
          <div class="body"></div>
          <img class="icon" src="assets/icon.png" alt="" />
          <div class="name">Поряд</div>
          <div class="stub">Є куди. Буде з ким.</div>
          <div class="perf"></div>
          <div class="bn" style="left:-20px"></div><div class="bn" style="left:740px"></div>
        </div>
        <div id="free">безкоштовно</div>
        <div id="store">
          <div id="badges">
            <img src="assets/appstore-badge-uk.svg" alt="Завантажте в App Store" />
            <img src="assets/googleplay-badge-uk.svg" alt="Завантажте з Google Play" />
          </div>
          <div class="tm" data-layout-ignore>
            <div>Apple, логотип Apple і App Store є торговельними марками Apple Inc.</div>
            <div>Google Play і логотип Google Play є торговельними марками Google LLC.</div>
          </div>
        </div>
      </div>

      <svg id="grain" width="1080" height="1920" aria-hidden="true">
        <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1080" height="1920" filter="url(#noise)" />
      </svg>
    </div>

    <script>
      (function () {
        // Real live Kyiv events on Sat 31.10 (prod, checked 25.10); titles as the app shows them, shortened only by cutting.
        // [rank, genre label, stub colour, title, venue, start, sticker]
        var EV = [
          [5, "ДІТЯМ", "#1b7979", "Хелловін-бал графа Дракули", "Будинок офіцерів", "12:00", "🧛"],
          [4, "ДІТЯМ", "#1b7979", "Майстер-клас із вирізання гарбуза", "Продюсерський центр Ізмайлової", "13:00", "🎃"],
          [3, "МИСТЕЦТВО", "#ac345e", "Конотопська відьма", "Будинок офіцерів", "18:00", "🧹"],
          [2, "МУЗИКА", "#6041b1", "Super Rock Halloween Show", "Docker Pub", "19:00", "🤘"],
          [1, "МУЗИКА", "#6041b1", "KARNA. Party на Хелловін", "Stereo Plaza", "19:00", "🕺"]
        ];
        var TOP = 340, GAP = 222, T0 = 1.7, STEP = 1.5;
        var list = document.getElementById("list");
        EV.forEach(function (e, i) {
          var s = document.createElement("div"); s.className = "slot"; s.id = "slot" + e[0]; s.style.top = (TOP + i * GAP) + "px";
          s.innerHTML = '<div class="ghost"></div><div class="tk"><div class="body"><div class="title"></div><div class="venue"></div></div>' +
            '<div class="stub"><div class="stk">' + e[6] + '</div><div class="g"></div><div class="time"></div></div><div class="perf"></div><div class="n t"></div><div class="n b"></div></div>' +
            '<div class="num">' + e[0] + '</div>';
          s.querySelector(".title").textContent = e[3];
          s.querySelector(".venue").textContent = e[4];
          s.querySelector(".g").textContent = e[1];
          s.querySelector(".stub").style.background = e[2];
          s.querySelector(".time").textContent = e[5];
          list.appendChild(s);
        });

        var tl = gsap.timeline({ paused: true });
        function shake(at, a) {
          [[a, -a * 0.6], [-a * 0.8, a * 0.5], [a * 0.4, a * 0.3], [0, 0]].forEach(function (d, k) {
            tl.to("#shake", { x: d[0], y: d[1], duration: 0.035, ease: "none" }, at + k * 0.035);
          });
        }

        // ---- 0–1.7: the cover — the question and five empty numbered slots; the head breathes, a ghost drifts
        tl.fromTo("#head span", { scale: 1 }, { scale: 1.05, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.18 }, 0.4);
        tl.fromTo(".num", { scale: 1 }, { scale: 1.15, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.08 }, 0.9);
        tl.fromTo("#ghostie", { x: 0, y: 0, rotation: -8 }, { x: 1400, y: -120, rotation: 8, duration: 9, ease: "none" }, 0);

        // ---- 1.7–8.2: 5 → 1, a slam every 1.5 s; the ticket punches into its slot, the screen shakes, the sticker pops
        EV.forEach(function (e, i) {
          var at = T0 + i * STEP, sel = "#slot" + e[0];
          tl.fromTo(sel + " .tk", { opacity: 0, scale: 1.45, rotation: i % 2 ? 4 : -4 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.2, ease: "power4.in" }, at);
          tl.set(sel + " .ghost", { opacity: 0 }, at + 0.2);
          tl.fromTo(sel + " .num", { scale: 1 }, { scale: 1.35, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, at + 0.2);
          shake(at + 0.2, e[0] === 1 ? 16 : 9);
          tl.fromTo(sel + " .stk", { opacity: 0, scale: 0.3, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.24, ease: "back.out(3)" }, at + 0.28);
        });
        // №1 gets a pulse
        tl.fromTo("#slot1", { scale: 1 }, { scale: 1.04, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.inOut", immediateRender: false }, 8.6);

        // ---- 9.0–11.0: the list drops away, the real map punches in — hundreds more
        tl.to(["#list", "#head"], { opacity: 0, y: 120, duration: 0.25, ease: "power2.in" }, 9.0);
        tl.fromTo("#map", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 9.1);
        tl.to("#mapfade", { opacity: 1, duration: 0.2 }, 9.1);
        tl.fromTo("#more", { opacity: 0, y: 14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "back.out(2.4)" }, 9.2);
        shake(9.4, 8);

        // ---- 11.0–14.9: the end card; static from 11.9
        tl.set("#end", { opacity: 1 }, 11.1);
        tl.fromTo("#brand", { opacity: 0, y: 160, rotation: -3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.4, ease: "back.out(1.5)" }, 11.1);
        tl.fromTo("#bait", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 11.35);
        tl.fromTo("#free", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 11.55);
        tl.set("#store", { opacity: 1 }, 11.85);
        tl.set(["#map", "#mapfade", "#more"], { opacity: 0 }, 11.15);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
