<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>A3 · переїзд у нове місто — 14.25 с, 9:16</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* One ground for the whole film (compositions/film.json). Coral = the name «Поряд», nothing else. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Brand ground, from the brand end card: night with a soft indigo glow and film grain */
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0f; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle 820px at 540px 860px, #1b1a36, rgba(27, 26, 54, 0)), #0b0b0f; color: #f5f5f7; }
      /* finite loop (26 × 0.5 s = 13 s), so the last 1.25 s hold still */
      @keyframes hf-grain-noise {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-5%, -5%); }
        20% { transform: translate(-10%, 5%); }
        30% { transform: translate(5%, -10%); }
        40% { transform: translate(-5%, 15%); }
        50% { transform: translate(-10%, 5%); }
        60% { transform: translate(15%, 0); }
        70% { transform: translate(0, 10%); }
        80% { transform: translate(-15%, 0); }
        90% { transform: translate(10%, 5%); }
      }
      #grain {
        position: absolute;
        z-index: 20;
        pointer-events: none;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.08;
        animation: hf-grain-noise 0.5s steps(1) 26 both;
      }
      #hook, #proof { z-index: 1; }
      #turn, #cta { z-index: 2; }
      #card { z-index: 5; }
      #mark { z-index: 6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.25" data-fps="30" data-width="1080" data-height="1920">
      <!-- Beats, back to back (times = compositions/film.json) -->
      <section id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.6" data-track-index="1" data-width="1080" data-height="1920"></section>
      <section id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="5.6" data-duration="5" data-track-index="1" data-width="1080" data-height="1920"></section>
      <section id="turn" data-composition-id="turn" data-composition-src="compositions/turn.html" data-start="10.6" data-duration="1.55" data-track-index="1" data-width="1080" data-height="1920"></section>
      <section id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="12.15" data-duration="2.1" data-track-index="1" data-width="1080" data-height="1920"></section>

      <!-- Carriers: one object each, on one tween across a seam -->
      <section id="card" data-composition-id="card" data-composition-src="compositions/card.html" data-start="9.8" data-duration="2.35" data-track-index="2" data-width="1080" data-height="1920"></section>
      <section id="mark" data-composition-id="mark" data-composition-src="compositions/mark.html" data-start="11.15" data-duration="3.1" data-track-index="3" data-width="1080" data-height="1920"></section>

      <!-- Brand grain over everything, whole film -->
      <div id="grain" class="clip" data-start="0" data-duration="14.25" data-track-index="4" data-layout-ignore=""></div>

      <!-- Audio -->
      <!-- music: calm.m4a from 2.88 s, so its lift (8.03 s in the track) lands as the city opens between the lines (5.15) -->
      <audio id="music" src="assets/audio/music.m4a" data-start="0" data-media-start="2.88" data-duration="14.25" data-track-index="10" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.15,&quot;v&quot;:0.9},{&quot;t&quot;:13.65,&quot;v&quot;:0.9},{&quot;t&quot;:14.25,&quot;v&quot;:0}]}]}"></audio>
      <!-- hook: two stops, three pills, question, three arrivals of the verdict, step back, «а місто — поруч», the opening -->
      <audio id="sfx-home" src="assets/audio/ui_tick.wav" data-start="0.1" data-duration="0.1" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-work" src="assets/audio/ui_tick.wav" data-start="0.25" data-duration="0.1" data-track-index="14" data-volume="0.25"></audio>
      <audio id="sfx-pill-1" src="assets/audio/ui_tick.wav" data-start="0.7" data-duration="0.1" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-pill-2" src="assets/audio/ui_tick.wav" data-start="0.9" data-duration="0.1" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-pill-3" src="assets/audio/ui_tick.wav" data-start="1.1" data-duration="0.1" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-ask" src="assets/audio/ui_tick.wav" data-start="1.35" data-duration="0.1" data-track-index="13" data-volume="0.25"></audio>
      <audio id="sfx-v1" src="assets/audio/pin_pop_1.wav" data-start="2.35" data-duration="0.25" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-v2" src="assets/audio/pin_pop_1.wav" data-start="2.95" data-duration="0.25" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-v3" src="assets/audio/pin_pop_1.wav" data-start="3.55" data-duration="0.25" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-out" src="assets/audio/whoosh.wav" data-start="3.95" data-duration="0.27" data-track-index="15" data-volume="0.2"></audio>
      <audio id="sfx-words" src="assets/audio/ui_tick.wav" data-start="4.2" data-duration="0.1" data-track-index="13" data-volume="0.25"></audio>
      <audio id="sfx-poruch" src="assets/audio/ui_tick.wav" data-start="4.62" data-duration="0.1" data-track-index="13" data-volume="0.25"></audio>
      <audio id="sfx-open" src="assets/audio/whoosh.wav" data-start="5.1" data-duration="0.27" data-track-index="15" data-volume="0.28"></audio>
      <!-- proof: captions -->
      <audio id="sfx-cap-1" src="assets/audio/ui_tick.wav" data-start="5.8" data-duration="0.1" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-cap-2" src="assets/audio/ui_tick.wav" data-start="7.55" data-duration="0.1" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-cap-3" src="assets/audio/ui_tick.wav" data-start="9.05" data-duration="0.1" data-track-index="13" data-volume="0.3"></audio>
      <!-- card lifts out, turn line, brand reveal, lockup to the end card, «безкоштовно» -->
      <audio id="sfx-lift" src="assets/audio/whoosh.wav" data-start="9.85" data-duration="0.27" data-track-index="15" data-volume="0.28"></audio>
      <audio id="sfx-turn" src="assets/audio/ui_tick.wav" data-start="10.7" data-duration="0.1" data-track-index="13" data-volume="0.3"></audio>
      <audio id="sfx-brand" src="assets/audio/pin_pop_1.wav" data-start="11.15" data-duration="0.25" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-travel" src="assets/audio/whoosh.wav" data-start="11.95" data-duration="0.27" data-track-index="15" data-volume="0.28"></audio>
      <audio id="sfx-free" src="assets/audio/ui_tick.wav" data-start="12.91" data-duration="0.1" data-track-index="13" data-volume="0.3"></audio>
    </div>

    <script>
      // Every move lives in the sections; the root only paints the ground and mixes the audio.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
