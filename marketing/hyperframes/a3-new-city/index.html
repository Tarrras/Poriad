    <style>
      /* A3 «місто, намальоване лініями, що засвічується»: dusk ground, thin warm-white line art, amber windows.

      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1c3a; }

      #say { z-index: 3; }
      #hw-path-text { z-index: 4; }
      #svg-stroke-trace { z-index: 5; }
      #cta { z-index: 6; }
    </style>
  </head>
  <body>

      <!--
        One continuous drawing, no scene cuts. Beats (global seconds):
        0.00–4.40  hook    «щойно переїхали?»; «дім» and «робота» trace in white line, a dot shuttles the dotted route,
                           the trail wears in; notes: «дім → робота → дім», the zero tally with hand-circled zeros
        4.40–6.35  reveal  «дім» lights, a warm radial light spreads from it, the camera pulls back and the city draws
                           itself around in three parallax rows, windows switching on one by one; «а місто — поруч»
        6.35–10.85 phone   one lit window comes forward and becomes the screen (map-kyiv-weekend), floating on a slow
                           tilt rig; district → city → the card; notes «відкриваєш мапу», «бачиш, що відбувається довкола»;
                           the screen goes back into its window; note «і місто стає твоїм»
        11.0–12.85 name    «твоє нове місто. нарешті видно.» — every window at once; coral «Поряд» traced, then filled
        12.85–14.5 end     the lit city settles into the blind zone; end card v2 grid: slogan (from 12.42), bait note, icon, «безкоштовно»,
                           App Store + Google Play badges (hard cut), Apple and Google lines; still from 14.17
      -->
      <section id="city" data-composition-id="city" data-composition-src="compositions/city.html" data-start="0" data-duration="14.5" data-track-index="1" data-width="1080" data-height="1920"></section>
