<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-cyrillic-400-normal.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2");
          font-weight: 600;
          font-display: block;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
          font-weight: 400;
          font-display: block;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
          font-weight: 600;
          font-display: block;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        /* Soft end card on the dusk: the lit city has settled low (city.html), «Поряд» is traced at y 833–952
           (svg-stroke-trace); this layer adds the bait note, the icon above the name and the store column below it. */
        #cta-root { position: absolute; inset: 0; overflow: hidden; color: #f7f1fb; font-family: "Inter", system-ui, sans-serif; }
        #cta-bait { position: absolute; left: 96px; top: 296px; width: 830px; font-weight: 400; font-style: italic; font-size: 50px; line-height: 1.2; letter-spacing: -0.01em; white-space: nowrap; text-shadow: 0 4px 22px rgba(16, 10, 36, 0.6); }
        #cta-bait span { opacity: 0; }
        #cta-bait .cta-emoji { font-style: normal; }
        #cta-icon { position: absolute; left: 450px; top: 598px; width: 180px; height: 180px; border-radius: 41px; opacity: 0; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 0 80px rgba(255, 196, 110, 0.28), 0 26px 80px rgba(12, 8, 30, 0.5); }
        #cta-col { position: absolute; left: 160px; width: 760px; top: 988px; display: flex; flex-direction: column; align-items: center; }
        #cta-free { font-weight: 600; font-size: 34px; line-height: 1.2; color: #d9d0e6; opacity: 0; }
        #cta-store { display: flex; flex-direction: column; align-items: center; opacity: 0; }
        /* Official badge: untouched file, height 104px, no transform/filter/shadow */
        #cta-store .badge { display: block; height: 104px; width: auto; margin-top: 24px; }
        #cta-store .tm { margin-top: 26px; max-width: 760px; text-align: center; font-weight: 400; font-size: 22px; line-height: 1.35; color: #b9b0c8; }
      </style>

      <div id="cta-root" data-composition-id="cta" data-width="1080" data-height="1920">
        <div id="cta-bait"></div>
        <img id="cta-icon" data-brand-mark="" src="assets/icon.png" alt="">
        <div id="cta-col">
          <div id="cta-free"></div>
          <div id="cta-store">
            <img class="badge" src="assets/appstore-badge-uk.svg" alt="Завантажте в App Store">
            <div class="tm" id="cta-tm"></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const COPY = {
            bait: "скільки ти вже в новому місті?",
            emoji: "👇",
            free: "безкоштовно",
            tm: "Apple, логотип Apple і App Store є торговельними марками Apple Inc.",
          };
          const T = { bait: 0.45, icon: 0.15, free: 0.4, store: 0.6 }; // local; the host starts at 12.8
          const $ = (s) => document.querySelector(s);
          const bait = $("#cta-bait");
          Array.from(COPY.bait + " ").forEach((ch) => { const s = document.createElement("span"); s.textContent = ch; bait.appendChild(s); });
          const em = document.createElement("span");
          em.className = "cta-emoji";
          em.textContent = COPY.emoji;
          bait.appendChild(em);
          $("#cta-free").textContent = COPY.free;
          $("#cta-tm").textContent = COPY.tm;
          const tl = gsap.timeline({ paused: true });
          const chars = bait.querySelectorAll("span");
          tl.to(chars, { opacity: 1, duration: 0.1, ease: "sine.out", stagger: 0.62 / chars.length }, T.bait);
          tl.fromTo("#cta-icon", { opacity: 0, y: 18, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.75, ease: "sine.out" }, T.icon);
          tl.to("#cta-free", { opacity: 1, duration: 0.5, ease: "sine.out" }, T.free);
          tl.set("#cta-store", { opacity: 1 }, T.store); // hard cut, the badge itself is never animated
          window.__timelines["cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
