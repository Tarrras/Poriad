<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Unbounded";
          src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2");
          font-weight: 200 900;
          font-display: block;
          unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
        }
        @font-face {
          font-family: "Unbounded";
          src: url("assets/fonts/unbounded-latin.woff2") format("woff2");
          font-weight: 200 900;
          font-display: block;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        /* The narrator: quiet, left-set Unbounded 300 at the top of the sky; letters fade in left to right. */
        #say-root { position: absolute; inset: 0; overflow: hidden; }
        .say-line { position: absolute; left: 90px; width: 830px; font-family: "Unbounded", system-ui, sans-serif; font-weight: 300; font-size: 60px; line-height: 1.16; letter-spacing: -0.035em; color: #F4EFF8; white-space: nowrap; text-shadow: 0 4px 24px rgba(16, 10, 36, 0.55); filter: blur(0px); }
        .say-line span { opacity: 0; }
        #say-q, #say-near, #say-name1 { top: 262px; }
        #say-name2 { top: 344px; }
      </style>

      <div id="say-root" data-composition-id="say" data-width="1080" data-height="1920">
        <div id="say-q" class="say-line"></div>
        <div id="say-near" class="say-line"></div>
        <div id="say-name1" class="say-line"></div>
        <div id="say-name2" class="say-line"></div>
      </div>

      <script>
        (() => {
          // [id, text, in, out] in film seconds (the host starts at 0)
          const LINES = [
            ["#say-q", "щойно переїхали?", 0.12, 4.15],
            ["#say-near", "а місто — поруч", 4.95, 6.2],
            ["#say-name1", "твоє нове місто.", 11.0, 12.85],
            ["#say-name2", "нарешті видно.", 11.4, 12.85], // with every window switching on
          ];
          const tl = gsap.timeline({ paused: true });
          LINES.forEach(([id, text, tIn, tOut]) => {
            const n = document.querySelector(id);
            Array.from(text).forEach((ch) => { const s = document.createElement("span"); s.textContent = ch; n.appendChild(s); });
            tl.to(n.querySelectorAll("span"), { opacity: 1, duration: 0.32, ease: "sine.out", stagger: 0.028 }, tIn);
            tl.to(n, { opacity: 0, filter: "blur(6px)", duration: 0.38, ease: "sine.in" }, tOut);
          });
          window.__timelines["say"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
