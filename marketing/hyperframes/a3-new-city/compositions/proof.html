<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
      /* Fonts: local, variable Unbounded + Inter 400/600, split cyrillic/latin */
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-cyrillic.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Unbounded";
        src: url("assets/fonts/unbounded-latin.woff2") format("woff2");
        font-weight: 200 900;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-cyrillic-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
        #proof-root { position: absolute; inset: 0; overflow: hidden; color: #f5f5f7; font-family: "Inter", system-ui, sans-serif; }
        #proof-exit, #proof-cam { position: absolute; inset: 0; }
        /* the picture fades out above y 412, so the caption band above it always sits on the dark ground */
        #proof-exit { transform-origin: 540px 930px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 412px, #000 470px); mask-image: linear-gradient(to bottom, transparent 0, transparent 412px, #000 470px); }
        #proof-cam { transform-origin: 0 0; }
        #proof-glow { position: absolute; left: 40px; top: 420px; width: 1000px; height: 1000px; border-radius: 50%; background: radial-gradient(circle closest-side, rgba(109, 74, 201, 0.3), rgba(109, 74, 201, 0)); }
        #proof-phone {
          position: absolute;
          left: 293px;
          top: 400px;
          width: 494px;
          height: 1046px;
          padding: 12px;
          border-radius: 66px;
          background: #050506;
          box-shadow: 0 0 0 2px #3b3b44, 0 0 0 4px #16161b, inset 0 0 0 1px rgba(255, 255, 255, 0.09), 0 80px 160px rgba(0, 0, 0, 0.6);
        }
        #proof-screen { position: relative; width: 470px; height: 1022px; border-radius: 54px; overflow: hidden; background: #050506; }
        #proof-screen .shot, #proof-screen .glare { position: absolute; left: 0; top: 0; width: 470px; height: 1022px; }
        #proof-screen .shot { display: block; object-fit: cover; }
        #proof-screen .glare { background: linear-gradient(118deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 38%); }
        /* «what's on around you»: a soft ring breathes out of a few pins */
        #proof-screen .ping { position: absolute; width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(109, 74, 201, 0.85); opacity: 0; }

        /* captions — one style for the whole film: a fixed band (x 160–920, y 280–416) above the picture,
           one size, centred; they fade in and out in place and never move sideways */
        .caption-band { position: absolute; left: 160px; width: 760px; top: 280px; height: 136px; display: flex; align-items: center; justify-content: center; }
        .caption { display: block; max-width: 760px; font-family: "Unbounded", system-ui, sans-serif; font-weight: 300; font-size: 60px; line-height: 1.13; letter-spacing: -0.045em; text-align: center; text-wrap: balance; color: #f5f5f7; text-shadow: 0 8px 30px rgba(0, 0, 0, 0.6); }
      </style>

      <div id="proof-root" data-composition-id="proof" data-width="1080" data-height="1920">
        <div id="proof-exit">
          <div id="proof-glow"></div>
          <div id="proof-cam" data-layout-allow-overflow="true">
            <div id="proof-phone"><div id="proof-screen"></div></div>
          </div>
        </div>
        <div id="proof-caps"></div>
      </div>

      <script>
        (() => {
          // ═══ PHONE — one screen, three camera moves (local s). Points are screenshot px (1206×2622);
          //     cam.at lands on canvas cam.to at zoom cam.s ═══
          const PHONE = {
            shot: "assets/ui/map-kyiv-weekend.png",
            // = hook.html MATCH: the hook's window already shows this district at this zoom, so the cut is invisible
            match: { s: 4, at: [480, 1000], to: [540, 1000] },
            // pull back from the district to the whole city: the full phone, centred
            city: { t: 0, d: 1.9, s: 1, at: [603, 1311], to: [540, 923] },
            drift: { t: 1.9, d: 1.4, s: 1.05, at: [603, 1311], to: [540, 923] },
            // rings out of a few pins while «бачиш, що відбувається довкола» is up
            pings: [{ at: [437, 843], t: 1.95 }, { at: [983, 1213], t: 2.2 }, { at: [541, 1298], t: 2.45 }, { at: [174, 950], t: 2.7 }, { at: [697, 1429], t: 2.95 }],
            // push onto the event card (card.html PUSH = this)
            card: { t: 3.3, d: 0.8, s: 2.2, at: [546, 2075], to: [540, 620] }, // card high, so «Знайдено подій» sits in the top fade
            out: 4.2, // the card is handed to the root here; the phone falls away around it
          };
          const CAPTIONS = [
            { text: "відкриваєш мапу", at: 0.2, out: 1.75 },
            { text: "бачиш, що відбувається довкола", at: 1.95, out: 3.3 },
            { text: "і місто стає твоїм", at: 3.45, out: 4.65 },
          ];

          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          const el = (tag, cls, text) => {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text != null) n.textContent = text;
            return n;
          };

          const K = 470 / 1206;
          const SCREEN_X = 540 - 235;
          const SCREEN_Y = 400 + 12;
          const screen = $("#proof-screen");
          const img = screen.appendChild(el("img", "shot"));
          img.src = PHONE.shot;
          img.alt = "";
          screen.appendChild(el("div", "glare"));

          const camState = ({ s, at, to }) => ({ scale: s, x: to[0] - s * (SCREEN_X + at[0] * K), y: to[1] - s * (SCREEN_Y + at[1] * K) });
          const camTo = (c, ease) => tl.to("#proof-cam", { ...camState(c), duration: c.d, ease }, c.t);

          // the hook's window was this district; the camera pulls back to the whole city, starting from rest
          tl.fromTo("#proof-cam", camState(PHONE.match), { ...camState(PHONE.city), duration: PHONE.city.d, ease: "power2.inOut", immediateRender: true }, PHONE.city.t);
          camTo(PHONE.drift, "sine.inOut");
          PHONE.pings.forEach(({ at: [px, py], t }) => {
            const p = screen.appendChild(el("div", "ping"));
            p.style.left = `${(px * K - 20).toFixed(1)}px`;
            p.style.top = `${(py * K - 20).toFixed(1)}px`;
            tl.fromTo(p, { opacity: 0.95, scale: 1 }, { opacity: 0, scale: 2.4, duration: 0.9, ease: "power2.out", immediateRender: false }, t);
          });
          camTo(PHONE.card, "power2.inOut");
          // the root lifts the card out at PHONE.out; the phone falls away around it
          tl.to("#proof-exit", { scale: 0.92, opacity: 0, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, PHONE.out);

          // captions
          CAPTIONS.forEach((c) => {
            const cap = $("#proof-caps").appendChild(el("div", "caption-band")).appendChild(el("div", "caption", c.text));
            tl.fromTo(cap, { opacity: 0, y: 20, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, c.at);
            tl.to(cap, { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, c.out - 0.25);
          });

          window.__timelines["proof"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
