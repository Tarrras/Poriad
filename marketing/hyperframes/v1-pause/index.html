    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Sofia Sans Condensed"; src: url("assets/fonts/SofiaSansCondensed-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Sofia Sans Condensed"; src: url("assets/fonts/SofiaSansCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Sofia Sans Extra Condensed"; src: url("assets/fonts/SofiaSansExtraCondensed-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-cyrillic-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      /* A slot-machine reel of «Корінець» tickets: graphite #0F1017, tickets #1C1B21 with genre stubs.
         Tickets swap by hard cut (no blur), so any paused frame shows one readable ticket.
         Only the stub colour changes during the spin; the screen itself never flashes. Coral is «Поряд» only. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0f1017; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #f3f3f0; font-family: "Sofia Sans Condensed", sans-serif;
        background: radial-gradient(80% 40% at 50% 48%, #1b1b25 0%, #0f1017 70%); }

      #hook { position: absolute; left: 80px; top: 250px; width: 840px; text-align: center; }
      #hook .l1 { display: block; font-weight: 800; font-size: 128px; line-height: 128px; letter-spacing: -1px; }
      #hook .l2 { display: block; margin-top: 18px; font-weight: 700; font-size: 62px; line-height: 66px; color: #c8c7d0; }

      /* the reel window: hairlines and two pointers */
      .rail { position: absolute; left: 80px; width: 840px; height: 3px; background: #2e2d35; }
      #rail-t { top: 668px; } #rail-b { top: 1170px; }
      .ptr { position: absolute; top: 898px; width: 0; height: 0; border-top: 22px solid transparent; border-bottom: 22px solid transparent; }
      #ptr-l { left: 46px; border-left: 26px solid #f3f3f0; }
      #ptr-r { left: 1008px; border-right: 26px solid #f3f3f0; }

      /* tickets: body 600 + stub 240, 440 tall; notches are discs of the ground colour on the perforation */
      #reel { position: absolute; left: 80px; top: 700px; width: 840px; height: 440px; }
      .tk { position: absolute; inset: 0; opacity: 0; }
      .tk .body { position: absolute; left: 0; top: 0; width: 600px; height: 440px; border-radius: 40px 0 0 40px; background: #1c1b21; box-shadow: inset 0 0 0 2px #2e2d35; padding: 44px 40px 0 44px; }
      .tk .title { font-weight: 800; font-size: 70px; line-height: 78px; letter-spacing: -0.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding-bottom: 6px; }
      .tk .venue { position: absolute; left: 44px; right: 36px; bottom: 42px; font-family: "Inter", sans-serif; font-weight: 600; font-size: 30px; line-height: 36px; color: #a6a5ad; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tk .stub { position: absolute; left: 600px; top: 0; width: 240px; height: 440px; border-radius: 0 40px 40px 0; color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
      .tk .g { font-weight: 800; font-size: 28px; letter-spacing: 2px; }
      .tk .time { font-family: "Sofia Sans Extra Condensed", sans-serif; font-weight: 800; font-size: 118px; line-height: 112px; font-variant-numeric: tabular-nums; }
      .tk .day { font-weight: 800; font-size: 28px; letter-spacing: 2px; }
      .tk .perf { position: absolute; left: 598px; top: 24px; bottom: 24px; border-left: 4px dotted rgba(15, 16, 23, 0.6); }
      .tk .n { position: absolute; left: 580px; width: 40px; height: 40px; border-radius: 50%; background: #0f1017; }
      .tk .n.t { top: -20px; } .tk .n.b { bottom: -20px; }
      #frame { position: absolute; left: 68px; top: 688px; width: 864px; height: 464px; border: 6px solid #f3f3f0; border-radius: 50px; opacity: 0; }

      .plate { position: absolute; left: 160px; width: 760px; display: flex; flex-direction: column; align-items: center; opacity: 0; }
      .plate span { display: block; background: #f3f3f0; color: #141417; border-radius: 16px; padding: 8px 24px 12px; font-weight: 800; font-size: 56px; line-height: 62px; white-space: nowrap; }
      #ask { top: 1230px; }
      #got { top: 290px; left: 80px; width: 920px; }
      #got span { background: none; color: #f3f3f0; padding: 0; font-size: 120px; line-height: 128px; letter-spacing: -1px; }
      #all { top: 1462px; z-index: 3; }
      #q { top: 1130px; z-index: 5; }

      /* the map (full bleed, the app's own screen) and the name */
      #map { position: absolute; left: 0; top: 0; width: 1080px; height: 2348px; opacity: 0; z-index: 2; }
      #shade { position: absolute; inset: 0; background: rgba(13, 14, 20, 0.9); opacity: 0; z-index: 4; }
      #brand { position: absolute; left: 0; top: 640px; width: 1080px; display: flex; flex-direction: column; align-items: center; gap: 26px; opacity: 0; z-index: 5; }
      #brand img { width: 176px; height: 176px; border-radius: 40px; }
      #brand .name { font-weight: 800; font-size: 128px; line-height: 128px; letter-spacing: -1px; color: #ff8a5b; }

      #grain { position: absolute; z-index: 6; inset: 0; pointer-events: none; opacity: 0.08; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-fps="30" data-width="1080" data-height="1920">
      <div id="hook" data-hold><span class="l1">зупини відео 👇</span><span class="l2">і це твій план на суботу</span></div>
      <div class="rail" id="rail-t"></div><div class="rail" id="rail-b"></div>
      <div class="ptr" id="ptr-l"></div><div class="ptr" id="ptr-r"></div>
      <div id="reel"></div>
      <div id="frame"></div>
      <div class="plate" id="ask"><span>що випало? пиши в коменти 👇</span></div>
      <div class="plate" id="got"><span>а мені випало 👇</span></div>

      <img id="map" src="assets/ui/map-weekend.jpg" alt="Мапа «Поряд» з фільтром «Вихідні»" />
      <div class="plate" id="all"><span>вони всі — на одній мапі</span></div>
      <div id="shade"></div>
      <div id="brand"><img src="assets/icon.png" alt="" /><div class="name">Поряд</div></div>
      <div class="plate" id="q"><span>а тобі що випало? 👇</span></div>

      <svg id="grain" width="1080" height="1920" aria-hidden="true">
        <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="31" /><feColorMatrix type="saturate" values="0" /></filter>
        <rect width="1080" height="1920" filter="url(#noise)" />
      </svg>

      <!-- music: «Lofi Upbeat» by kulakovka (Pixabay) from 10.8 s — its full beat runs from the first frame; a short dip on the stop -->
      <audio id="music" src="assets/audio/music.m4a" data-start="0" data-media-start="10.8" data-duration="14" data-track-index="10" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.45},{&quot;t&quot;:7.7,&quot;v&quot;:0.45},{&quot;t&quot;:7.85,&quot;v&quot;:0.22},{&quot;t&quot;:8.6,&quot;v&quot;:0.45},{&quot;t&quot;:13.4,&quot;v&quot;:0.45},{&quot;t&quot;:14,&quot;v&quot;:0}]}]}"></audio>
      <!-- the reel: one click per ticket (built to the same frame list as FRAMES below), slowing to the stop at 7.8 -->
      <audio id="sfx-reel" src="assets/audio/reel.wav" data-start="0" data-duration="8.1" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-stop" src="assets/audio/pin_pop_1.wav" data-start="7.8" data-duration="0.25" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-map" src="assets/audio/whoosh.wav" data-start="9.4" data-duration="0.27" data-track-index="13" data-volume="0.25"></audio>
      <audio id="sfx-name" src="assets/audio/pin_pop_1.wav" data-start="11.55" data-duration="0.25" data-track-index="12" data-volume="0.35"></audio>
    </div>

    <script>
      (function () {
        // Real events of one Kyiv weekend (prod, live, 31.10–01.11.2026), titles as the app shows them; no faces, no 18+.
        // [genre, title, venue, day, time]
        var T = [
          ["c", "Стендап Субота", "ШELTER Stand-Up Club", "СУБОТА", "18:30"],
          ["a", "Конотопська відьма", "Будинок офіцерів", "СУБОТА", "18:00"],
          ["m", "Розум зник. Halloween", "Портер паб", "СУБОТА", "18:00"],
          ["k", "Майстер-клас із вирізання гарбуза", "Продюсерський центр", "СУБОТА", "13:00"],
          ["a", "Кайдашева сім'я", "Театр «Срібний острів»", "НЕДІЛЯ", "17:00"],
          ["m", "Гурт ЯРРА — Велесова ніч", "Docker-G pub", "СУБОТА", "19:00"],
          ["c", "Підпільний стендап", "Underground Stand Up Club", "СУБОТА", "19:00"],
          ["a", "За двома зайцями", "Центр Леся Курбаса", "СУБОТА", "17:00"],
          ["m", "Вечір стихій", "Національна філармонія", "НЕДІЛЯ", "17:00"],
          ["s", "Саундхілінг", "Центр сучасного мистецтва М17", "СУБОТА", "17:00"],
          ["a", "Мавка", "Палац «Україна»", "НЕДІЛЯ", "17:00"],
          ["c", "Гумористично-айтішне шоу «БулшІТ»", "Kooperativ", "СУБОТА", "17:30"],
          ["m", "Karna. Party на Хелловін", "Stereo Plaza", "СУБОТА", "19:00"],
          ["k", "Хелловін-бал графа Дракули", "Будинок офіцерів", "СУБОТА", "12:00"],
          ["a", "Три товариші", "Новий театр на Печерську", "НЕДІЛЯ", "17:00"],
          ["m", "Bach & Bach", "Кірха Святої Катерини", "СУБОТА", "15:00"],
          ["a", "Тіні забутих предків", "Театр юного глядача", "СУБОТА", "15:00"],
          ["c", "Стендап шоу про стосунки", "Kooperativ", "СУБОТА", "17:30"],
          ["m", "Легенди Данії", "Національна філармонія", "СУБОТА", "17:00"],
          ["a", "Маленький принц", "Театр «Сузір'я»", "СУБОТА", "17:00"],
          ["k", "Магія мильних бульбашок", "Продюсерський центр", "НЕДІЛЯ", "15:00"],
          ["m", "Transmission 2.0. Тільки в білому", "Origin Stage", "СУБОТА", "16:00"],
          ["a", "Памела, або як убити бабцю", "Театр «Браво»", "СУБОТА", "19:00"],
          ["c", "Книгарня Буе: «Двір королеви вампірів»", "Культурний кластер «Краків»", "СУБОТА", "18:00"],
          ["a", "Музика Франції під зорями", "Київський планетарій", "СУБОТА", "19:30"],
          ["m", "Super Rock Halloween Show", "Docker Pub", "СУБОТА", "19:00"],
          ["a", "Шантрапа", "Театр «Колесо»", "СУБОТА", "18:00"],
          ["k", "Мавка. Циркове шоу", "ЦКМ КПІ", "СУБОТА", "12:00"],
          ["m", "Віденський вечір", "Будинок вчених", "СУБОТА", "17:00"],
          ["a", "Чорний квадрат. Чиста імпровізація", "Театральний простір «CULT»", "СУБОТА", "18:30"],
          ["c", "Василь Байдак", "Центр культури КАІ", "СУБОТА", "19:00"],
          ["a", "Животоки. Етношоу", "Театр «Берегиня»", "СУБОТА", "17:00"],
          ["m", "Дух Франції", "Музей книги і друкарства", "НЕДІЛЯ", "15:00"],
          ["a", "Як продати чоловіка", "Театр на Михайлівській", "НЕДІЛЯ", "17:00"],
          ["m", "Історична ораторія «Віють вітри»", "Трапезний храм з палатою", "НЕДІЛЯ", "16:00"],
          ["a", "Kyiv Modern-Ballet. Травіата", "МЦКМ", "СУБОТА", "18:00"],
          ["k", "Івасик-Телесик", "Новий український театр", "СУБОТА", "12:00"],
          ["a", "Метелики на шпильках", "Театр на Троєщині", "СУБОТА", "18:00"],
          ["m", "Caribbean Club Disco Party", "Caribbean Club", "СУБОТА", "18:30"],
          ["k", "Тореадори з Васюківки", "Театр юного глядача", "НЕДІЛЯ", "15:00"],
          ["a", "Медитація «Sound Healing»", "Київський планетарій", "НЕДІЛЯ", "19:30"],
          ["m", "Zwyntar — Halloween Special", "Stereo Plaza", "НЕДІЛЯ", "18:30"],
          ["k", "Лікар Айболить", "Муніципальний театр ляльок", "НЕДІЛЯ", "11:00"],
          ["m", "Hans Zimmer Symphony", "МЦКМ", "НЕДІЛЯ", "18:00"],
          ["c", "Стендап в Укритті", "Komediant", "НЕДІЛЯ", "19:00"]
        ];
        var G = { c: ["СТЕНДАП", "#8d6a11"], a: ["МИСТЕЦТВО", "#ac345e"], m: ["МУЗИКА", "#6041b1"], k: ["ДІТЯМ", "#1b7979"], s: ["ЗУСТРІЧІ", "#a24c29"] };
        // frames per ticket at 30 fps: 40 fast, 4 slowing, then the last one stays (same list builds reel.wav)
        var FRAMES = [];
        for (var i = 0; i < 40; i++) FRAMES.push(5);
        FRAMES.push(6, 7, 9, 12);

        var reel = document.getElementById("reel");
        T.forEach(function (t, i) {
          var el = document.createElement("div"); el.className = "tk"; el.id = "tk" + i;
          // the spin is meant to be paused, not read: only the ticket it stops on is held long enough
          if (i < T.length - 1) el.setAttribute("data-layout-ignore", "");
          el.innerHTML = '<div class="body"><div class="title"></div><div class="venue"></div></div>' +
            '<div class="stub"><div class="g"></div><div class="time"></div><div class="day"></div></div>' +
            '<div class="perf"></div><div class="n t"></div><div class="n b"></div>';
          el.querySelector(".title").textContent = t[1];
          el.querySelector(".venue").textContent = t[2];
          el.querySelector(".g").textContent = G[t[0]][0];
          el.querySelector(".stub").style.background = G[t[0]][1];
          el.querySelector(".time").textContent = t[4];
          el.querySelector(".day").textContent = t[3];
          reel.appendChild(el);
        });

        var tl = gsap.timeline({ paused: true });
        function plate(id, at, out) {
          tl.fromTo(id, { opacity: 0, y: 12, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2)" }, at);
          if (out != null) tl.to(id, { opacity: 0, duration: 0.15, ease: "power1.in" }, out);
        }

        // ---- 0–7.8: the reel. Hard cuts only — every frame is one readable ticket
        var f = 0;
        T.forEach(function (_, i) {
          var at = f / 30;
          tl.set("#tk" + i, { opacity: 1 }, at);
          if (i < T.length - 1) { f += FRAMES[i]; tl.set("#tk" + i, { opacity: 0 }, f / 30); }
        });
        var STOP = f / 30; // 7.8
        plate("#ask", 0.6, STOP);

        // ---- 7.8–9.4: the stop — the frame snaps on, the last ticket jolts
        tl.to("#hook", { opacity: 0, duration: 0.15 }, STOP);
        tl.fromTo("#frame", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.in" }, STOP);
        tl.fromTo("#reel", { y: 0 }, { y: 10, duration: 0.06, ease: "power1.out", yoyo: true, repeat: 1 }, STOP + 0.12);
        plate("#got", STOP + 0.12, 9.35);

        // ---- 9.4–11.5: the ticket drops into the map: they are all there
        tl.to(["#frame", "#rail-t", "#rail-b", "#ptr-l", "#ptr-r"], { opacity: 0, duration: 0.2 }, 9.4);
        tl.to("#reel", { scale: 0.32, y: 300, opacity: 0, duration: 0.5, ease: "power3.in" }, 9.4);
        tl.fromTo("#map", { opacity: 0, scale: 1.08, transformOrigin: "50% 30%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 9.45);
        plate("#all", 9.5, 11.5);

        // ---- 11.55–14: the name and the question, held > 2 s; static from 12.0
        tl.to("#shade", { opacity: 1, duration: 0.3 }, 11.5);
        tl.fromTo("#brand", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 11.55);
        plate("#q", 11.7);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
