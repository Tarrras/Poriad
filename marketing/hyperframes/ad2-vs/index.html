          if (k % 6 === 3) {

            el.innerHTML = (k % 12 === 3 ? '<div class="img"></div>' : "") + '<div class="pt"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:64%"></div>';

            el.querySelector(".nm").style.width = 110 + ((k * 37) % 90) + "px";

        function clock(id, steps) {

        clock("clkL", L); clock("clkR", R);

        var tl = gsap.timeline({ paused: true });
        function steps(id, list, end) {
          list.forEach(function (s, j) {
            tl.set("#" + id + j, { opacity: 1 }, s[0]);
            tl.set("#" + id + j, { opacity: 0 }, j + 1 < list.length ? list[j + 1][0] : end);
          });
        }
        steps("clkL", L, 7.9); steps("clkR", R, 7.9);
        function shake(at, amp) { tl.fromTo("#world", { x: 0, y: 0 }, { x: amp, y: -amp * 0.6, duration: 0.035, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, at); }
        function pop(sel, at) { tl.fromTo(sel, { scale: 1 }, { scale: 1.14, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at); }
        function plate(sel, at, out) {
          tl.fromTo(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.6)" }, at);

        // ---- 0–1.6: the hook — everything on screen from frame 0, then each label punches on the beat
        pop("#lblL", 0.15); pop("#vs", 0.4); pop("#lblR", 0.65);
        tl.fromTo("#eyes", { rotation: 0 }, { rotation: 14, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0.9);

        // ---- left: the feed never stops, notifications stack up, the clock runs away
        tl.fromTo("#feed", { y: 0 }, { y: -3300, duration: 7.0, ease: "power1.in" }, 0.4);
        var BT = [2.0, 2.8, 3.9, 4.6, 5.6, 6.5];
        BT.forEach(function (t, j) {
          tl.fromTo("#ban" + j, { opacity: 0, y: -110 }, { opacity: 1, y: 0, duration: 0.18, ease: "back.out(1.6)" }, t);
          for (var i = 0; i < j; i++) {
            var d = j - i;
            tl.to("#ban" + i, { y: d * 90, scale: 1 - d * 0.04, opacity: d > 2 ? 0 : 1, duration: 0.18, ease: "power2.out" }, t);
          }
        });
        pop("#clkL", 3.03); shake(3.03, 6);
        pop("#clkL", 4.97); shake(4.97, 8);
        plate("#capL", 5.2);
        tl.fromTo("#lblL", { rotation: 0 }, { rotation: -4, duration: 0.08, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, 6.3);

        // ---- right: tap the map, whip to the event, tap «Календар», done
        tl.fromTo("#rip1", { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.7, duration: 0.4, ease: "power2.out", immediateRender: false }, 2.45);
        tl.to("#rMap", { scale: 1.16, transformOrigin: "43% 45%", duration: 0.25, ease: "power3.out" }, 2.5);
        tl.to("#rMap", { x: -440, filter: "blur(14px)", duration: 0.2, ease: "power3.in" }, 2.78);
        tl.fromTo("#rDetail", { x: 440, filter: "blur(14px)" }, { x: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out", immediateRender: false }, 2.84);
        pop("#clkR", 2.9);
        tl.to("#rDetail", { scale: 1.28, transformOrigin: "15% 58%", duration: 0.3, ease: "power3.inOut" }, 3.5);
        tl.fromTo("#rip2", { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.7, duration: 0.4, ease: "power2.out", immediateRender: false }, 3.85);
        tl.fromTo("#done", { opacity: 0, scale: 2.2, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.16, ease: "power4.in" }, 4.0);
        pop("#clkR", 4.05); shake(4.08, 6);
        plate("#capR", 4.2);
        tl.to("#rDetail", { scale: 1, duration: 0.4, ease: "power3.inOut" }, 4.55);

        // ---- 7.3–9.9: the right side takes the whole screen (beat drop), one flash, the map
        tl.fromTo("#full", { clipPath: "inset(0 0 0 50%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.32, ease: "power4.inOut", immediateRender: false }, 7.3);
        tl.fromTo("#full img", { x: 140, filter: "blur(12px)" }, { x: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", immediateRender: false }, 7.3);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.75, duration: 0.033, yoyo: true, repeat: 1, ease: "none", immediateRender: false }, 7.58);
        shake(7.6, 10);
        tl.fromTo("#full img", { scale: 1 }, { scale: 1.07, transformOrigin: "50% 40%", duration: 2.4, ease: "none", immediateRender: false }, 7.7);
        tl.set("#world", { opacity: 0 }, 7.7);
        tl.set("#capF", { opacity: 1 }, 7.8);
        tl.fromTo("#capF i", { opacity: 0, scale: 0.4, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: "back.out(3)", stagger: 0.09 }, 7.8);
        tl.fromTo("#capF span", { opacity: 0 }, { opacity: 1, duration: 0.05, stagger: 0.36 }, 7.8);
        tl.to("#capF", { opacity: 0, duration: 0.12 }, 9.85);

        // ---- 9.9–14: end card; badges by one hard cut, static from 11.2
        tl.to("#shade", { opacity: 1, duration: 0.25 }, 9.9);
        tl.fromTo("#brand", { opacity: 0, y: 260 }, { opacity: 1, y: 0, duration: 0.42, ease: "power4.out" }, 9.95);
        tl.fromTo("#brand", { rotation: 0 }, { rotation: -1.4, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 10.32);
        tl.fromTo("#bait", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 10.35);
        tl.fromTo("#free", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.6);
        tl.set("#store", { opacity: 1 }, 10.95);

        window.__timelines["main"] = tl;
      })();
    </script>
