    <script>
      (function () {
        // Real live Kyiv events of the coming weeks (prod, 25.10), titles as the app shows them; genre + time only, no dates.
        var G = { c: ["СТЕНДАП", "#8d6a11"], m: ["МУЗИКА", "#6041b1"], a: ["МИСТЕЦТВО", "#ac345e"], k: ["ДІТЯМ", "#1b7979"], s: ["ЗУСТРІЧІ", "#a24c29"] };
        // pins of the map in plane coordinates (city.jpg × 1.3, centred)
        var P = { p158: [-109, -446], p51a: [-313, -129], p51b: [-596, -26], p137: [78, -79], p189: [-109, 98], p4: [398, 31],
                  p82: [376, 244], p102: [-98, 482], p18: [229, 640], pu: [-518, 241], pk: [-273, 276], pk2: [220, 266] };
        // [genre, title, time, pin, dx, height above the map, launch time]
        var T = [
          ["m", "Легенди Данії", "17:00", "p158", 0, 300, -1.2],
          ["a", "Летюча миша", "18:00", "p137", 20, 340, -0.9],
          ["k", "Вінні-Пух", "11:00", "p51a", -10, 260, -0.6],
          ["m", "Віталій Лобач", "18:00", "pu", 0, 240, -1.0],
          ["s", "Саундхілінг", "17:00", "p102", 0, 200, -0.8],
          ["c", "Василь Байдак", "19:00", "p189", 0, 440, 2.0],
          ["c", "Підпільний стендап", "19:00", "p82", -30, 340, 2.06],
          ["c", "Настя Зухвала. Стендап тур", "18:00", "p51b", 40, 560, 2.12],
          ["c", "Стендап в Дороті Паб", "18:00", "p18", 0, 300, 2.18],
          ["m", "Магія Мішеля Леграна", "18:00", "p4", -20, 600, 2.98],
          ["m", "Очі в очі. Solo", "19:00", "pk2", 0, 380, 3.04],
          ["m", "Трибʼют Queen — гурт Beast", "19:00", "p102", 30, 460, 3.1],
          ["a", "Наталка Полтавка", "18:00", "pk", 0, 520, 3.96],
          ["a", "Чикаго", "17:00", "p158", 60, 300, 4.02],
          ["a", "Маленький принц", "17:00", "p18", -40, 620, 4.08],
          ["a", "Конотопська відьма", "17:00", "p82", 40, 700, 4.14],
          ["m", "Caribbean Club Disco Party", "18:30", "p137", -60, 680, 4.94],
          ["m", "LAMA", "19:00", "p189", 50, 760, 5.0],
          ["m", "OTOY", "19:00", "p51a", 30, 640, 5.06],
          ["k", "Мері Поппінс", "17:00", "p102", -40, 720, 5.43],
          ["k", "Лікар Айболить", "11:00", "pk2", 40, 640, 5.49],
          ["k", "Івасик-Телесик", "12:00", "p4", 30, 780, 5.55]
        ];
        var plane = document.getElementById("plane");
        var tl = gsap.timeline({ paused: true });
        var TILT = 55;
        tl.set("#world", { rotationX: TILT, z: -260, y: 0 }, 0);
        tl.to("#world", { z: -200, duration: 2.0, ease: "none" }, 0);

        T.forEach(function (t, i) {
          var p = P[t[3]], x = 784 + p[0] + t[4], y = 760 + p[1]; // plane coords are centre-relative; #plane origin is its top-left
          var ring = document.createElement("div"); ring.className = "ring"; ring.style.left = x + "px"; ring.style.top = y + "px"; ring.style.borderColor = G[t[0]][1];
          var el = document.createElement("div"); el.className = "tk"; el.style.left = x + "px"; el.style.top = y + "px";
          el.innerHTML = '<div class="body"></div><div class="stub"><div class="g"></div><div class="t"></div></div><div class="n a"></div><div class="n b"></div>';
          el.querySelector(".body").textContent = t[1];
          el.querySelector(".stub").style.background = G[t[0]][1];
          el.querySelector(".g").textContent = G[t[0]][0];
          el.querySelector(".t").textContent = t[2];
          plane.appendChild(ring); plane.appendChild(el);
          // launch: the ticket shoots up out of its pin along the map's normal, then stands facing the camera
          var at = t[6], h = t[5];
          if (at < 0) {
            // already in the air on frame 0 (the cover), still drifting up
            var k0 = -at / 1.4;
            tl.fromTo(el, { opacity: 1, z: h * (0.7 + 0.2 * k0), rotationX: -TILT, scale: 1 }, { opacity: 1, z: h * (0.95 + 0.2 * k0), duration: 2.0, ease: "none" }, 0);
          } else {
            tl.fromTo(ring, { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 3.2, duration: 0.6, ease: "power2.out", immediateRender: false }, at);
            tl.fromTo(el, { opacity: 0, z: 0, rotationX: -TILT + 40, scale: 0.4 }, { opacity: 1, z: h, rotationX: -TILT, scale: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, at);
          }
        });

        // ---- 0–2.0: the hook over the glowing city
        tl.fromTo("#hook", { scale: 1 }, { scale: 1.04, duration: 1.9, ease: "none" }, 0);
        tl.to("#hook", { opacity: 0, y: -80, duration: 0.18, ease: "power2.in" }, 1.88);

        // ---- 2.0–5.9: fireworks on the beat (0.49 s) while the camera flies into the city
        tl.to("#world", { z: 380, rotationX: TILT - 15, y: -60, duration: 3.9, ease: "power1.in" }, 2.0);
        tl.fromTo("#sweep", { x: -900, opacity: 1 }, { x: 1080, opacity: 1, duration: 0.7, ease: "power1.inOut" }, 2.0);
        tl.fromTo("#sweep", { x: -900 }, { x: 1080, duration: 0.7, ease: "power1.inOut", immediateRender: false }, 3.96);
        var W = [[2.0, 2.98], [2.98, 3.96], [3.96, 4.94], [4.94, 5.43], [5.43, 5.92]];
        W.forEach(function (w, i) {
          tl.fromTo("#w" + i, { opacity: 1, scale: 1.6, rotation: i % 2 ? 3 : -3 }, { opacity: 1, scale: 1, rotation: i % 2 ? 1.5 : -1.5, duration: 0.14, ease: "power4.in", immediateRender: false }, w[0]);
          tl.set("#w" + i, { opacity: 0 }, w[1]);
          tl.fromTo("#shake", { y: 0 }, { y: 8, duration: 0.04, yoyo: true, repeat: 1, ease: "none", immediateRender: false }, w[0] + 0.14);
        });

        // ---- 5.9–6.41: whip into the phone (one flash frame at the seam)
        tl.to("#stage", { x: -760, scaleX: 1.25, filter: "blur(26px)", duration: 0.28, ease: "power2.in" }, 5.9);
        tl.set("#flash", { opacity: 0.8 }, 6.17);
        tl.set("#flash", { opacity: 0 }, 6.2);
        tl.set("#stage", { opacity: 0 }, 6.2);
        tl.fromTo("#phone", { opacity: 1, x: 820, rotation: 6, filter: "blur(26px)" }, { opacity: 1, x: 0, rotation: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out", immediateRender: false }, 6.17);
        tl.fromTo("#shake", { x: 0 }, { x: -12, duration: 0.04, yoyo: true, repeat: 3, ease: "none", immediateRender: false }, 6.41);
