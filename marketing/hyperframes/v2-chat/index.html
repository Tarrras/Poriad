      /* An invented group chat on the night canvas: no messenger's logo or chrome, emoji avatars, paper bubbles for «you».

      .plate { position: absolute; left: 60px; width: 840px; top: 176px; display: flex; justify-content: center; opacity: 0; z-index: 3; }

      .msg.in { left: 24px; }
      .msg.out { right: 24px; }
      .msg .av { width: 84px; height: 84px; font-size: 46px; }

      .out .bub { background: #f3f3f0; color: #141417; border-bottom-right-radius: 8px; }
      .dots { display: inline-flex; gap: 8px; margin-left: 10px; vertical-align: middle; }
      .dots i { width: 14px; height: 14px; border-radius: 50%; background: #a6a5ad; display: block; }

      /* ticket previews: body 504 + stub 216, 228 tall */
      .tk { position: absolute; right: 24px; width: 720px; height: 228px; opacity: 0; }
      .tk .body { position: absolute; left: 0; top: 0; width: 504px; height: 228px; border-radius: 32px 0 0 32px; background: #1c1b21; box-shadow: inset 0 0 0 2px #2e2d35; padding: 24px 24px 0 30px; }
      .tk .title { font-family: "Sofia Sans Condensed", sans-serif; font-weight: 800; font-size: 56px; line-height: 60px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-bottom: 4px; }

      .tk .stub { position: absolute; left: 504px; top: 0; width: 216px; height: 228px; border-radius: 0 32px 32px 0; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Sofia Sans Condensed", sans-serif; }
      .tk .g, .tk .day { font-weight: 800; font-size: 32px; line-height: 34px; letter-spacing: 1.5px; }
      .tk .time { font-family: "Sofia Sans Extra Condensed", sans-serif; font-weight: 800; font-size: 96px; line-height: 94px; font-variant-numeric: tabular-nums; }
      .tk .perf { position: absolute; left: 502px; top: 18px; bottom: 18px; border-left: 4px dotted rgba(22, 22, 27, 0.6); }
      .tk .n { position: absolute; left: 488px; width: 32px; height: 32px; border-radius: 50%; background: #16161b; }
      .tk .n.t { top: -16px; } .tk .n.b { bottom: -16px; }

      /* the name */
      #shade { position: absolute; inset: 0; background: rgba(13, 13, 18, 0.9); opacity: 0; z-index: 4; }
      #brand { position: absolute; left: 0; top: 640px; width: 1080px; display: flex; flex-direction: column; align-items: center; gap: 26px; opacity: 0; z-index: 5; }
      #brand img { width: 176px; height: 176px; border-radius: 40px; }
      #brand .name { font-family: "Sofia Sans Condensed", sans-serif; font-weight: 800; font-size: 128px; line-height: 128px; letter-spacing: -1px; color: #ff8a5b; }
      #q { left: 0; width: 1080px; top: 1130px; z-index: 5; }

  <body>

    <script>
      (function () {
        // Real live events in Kyiv on Saturday 31.10.2026 (prod), titles as the app shows them (Event.displayTitle).
        // [stub colour, genre, title, venue, day, time]
        var T = [
          ["#8d6a11", "СТЕНДАП", "Підпільний Стендап", "Underground Standup Club", "СУБОТА", "19:00"],
          ["#6041b1", "МУЗИКА", "KARNA. Party на Хелловін", "Stereo Plaza", "СУБОТА", "19:00"],
          ["#ac345e", "МИСТЕЦТВО", "Сімейка Аддамсів", "Театр оперети", "СУБОТА", "17:00"]
        ];
        T.forEach(function (t, i) {
          var el = document.getElementById("t" + i);
          el.innerHTML = '<div class="body"><div class="title"></div><div class="venue"></div></div>' +
            '<div class="stub"><div class="g"></div><div class="time"></div><div class="day"></div></div>' +
            '<div class="perf"></div><div class="n t"></div><div class="n b"></div>';
          el.querySelector(".title").textContent = t[2];
          el.querySelector(".venue").textContent = t[3];
          el.querySelector(".stub").style.background = t[0];
          el.querySelector(".g").textContent = t[1];
          el.querySelector(".time").textContent = t[5];
          el.querySelector(".day").textContent = t[4];
        });

        var tl = gsap.timeline({ paused: true });
        function plate(id, at, out) {
          tl.fromTo(id, { opacity: 0, y: 12, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2)" }, at);
          if (out != null) tl.to(id, { opacity: 0, duration: 0.12, ease: "power1.in" }, out);
        }
        function pop(id, at) {
          tl.fromTo(id, { opacity: 0, y: 18, scale: 0.94, transformOrigin: "0% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.24, ease: "back.out(2.2)" }, at);
        }
        // the feed is bottom-anchored like a real chat: y puts the newest item 24 px above the input bar
        function scroll(y, at) { tl.to("#feed", { y: y, duration: 0.24, ease: "power3.out" }, at); }
        function clock(from, to, at) { tl.set(from, { opacity: 0 }, at); tl.set(to, { opacity: 1 }, at); tl.fromTo(to, { y: -8 }, { y: 0, duration: 0.2, ease: "power3.out" }, at); }

        // ---- 0–2.2: the question is already there (cover); someone types… and stops
        tl.set(["#k0", "#m0", "#typing", "#c1"], { opacity: 1 }, 0);
        tl.set("#feed", { y: 646 }, 0);
        tl.to("#typing .dots i", { opacity: 0.25, duration: 0.2, stagger: { each: 0.1, repeat: 3, yoyo: true } }, 0.05);
        tl.set("#typing", { opacity: 0 }, 1.4);
        tl.to("#c1", { opacity: 0, duration: 0.12, ease: "power1.in" }, 2.2);

        // ---- 2.2–4.6: the clock jumps, the answers are not answers
        clock("#k0", "#k1", 2.2); plate("#c2", 2.2, 3.4);
        pop("#m1", 2.2);
        pop("#m2", 2.8); scroll(524, 2.8);
        clock("#k1", "#k2", 3.4); plate("#c3", 3.4, 4.6);
        pop("#m3", 3.4); scroll(402, 3.4);

        // ---- 4.6–7.0: you send three tickets; the beat drops with the first
        plate("#c4", 4.6, 7.0);
        ["#t0", "#t1", "#t2"].forEach(function (id, i) {
          tl.fromTo(id, { opacity: 0, x: 140, rotation: 3 }, { opacity: 1, x: 0, rotation: 0, duration: 0.32, ease: "power4.out" }, 4.6 + i * 0.35);
          scroll([144, -108, -360][i], 4.6 + i * 0.35);
        });

        // ---- 7.0–9.2: a plan in a minute
        clock("#k2", "#k3", 7.0); plate("#c5", 7.0, 9.2);
        [["#r0", -488], ["#r1", -610], ["#r2", -732]].forEach(function (r, i) {
          pop(r[0], 7.05 + i * 0.35); scroll(r[1], 7.05 + i * 0.35);
        });

        // ---- 9.2–12: the name and the forward, held > 2 s
        tl.to("#shade", { opacity: 1, duration: 0.3 }, 9.2);
        tl.to("#chat", { opacity: 0, scale: 0.97, duration: 0.3, ease: "power2.in" }, 9.2);
        tl.fromTo("#brand", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 9.3);
        plate("#q", 9.45);

        window.__timelines["main"] = tl;
      })();
    </script>
